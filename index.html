  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ja\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ファルダゴ冒険譚 〜乾杯日和〜<\u002Ftitle>\n<style>\n:root{\n  --terra:#e8875f; --terra-d:#c9663f; --cream:#f2ede4; --sea:#4aa3c9; --sea-d:#2e7fa3;\n  --sun:#f0b94a; --ink:#f2efe9; --win:rgba(13,15,20,.78);\n  --leo:#6db3d9; --tiera:#f0954a; --wayne:#e8c34a; --romdo:#8d7cc4; --hao:#7fae5c; --ninon:#e07fae;\n  --glass:rgba(16,18,24,.68); --line:rgba(255,255,255,.16); --line-soft:rgba(255,255,255,.09);\n  --txt:#f2efe9; --dim:rgba(242,239,233,.6);\n}\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%;background:#08090c;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','BIZ UDPGothic','Meiryo',sans-serif;color:var(--txt);overflow:hidden}\n#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n#game{position:relative;width:min(100vw,177.8vh);height:min(56.25vw,100vh);background:#000;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.9);font-size:calc(min(100vw,177.8vh)/64)}\n@media (orientation:portrait){\n  #game{width:100vw;height:100dvh;font-size:min(3.6vw,2.1dvh)}\n}\n.screen{position:absolute;inset:0;display:none}\n.screen.on{display:block}\n.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .6s, opacity .6s}\n::-webkit-scrollbar{width:.4em;height:.4em}\n::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:1em}\n::-webkit-scrollbar-track{background:transparent}\n/* 背景フィルタ */\n.f-none{filter:none}\n.f-eve{filter:sepia(.45) saturate(1.3) hue-rotate(-18deg) brightness(.88)}\n.f-night{filter:brightness(.42) saturate(.7) hue-rotate(12deg)}\n.f-interior{filter:brightness(.72) sepia(.28) blur(2px)}\n.f-ruins{filter:hue-rotate(58deg) saturate(.75) brightness(.75) contrast(1.05)}\n.f-deep{filter:hue-rotate(90deg) saturate(.9) brightness(.5) contrast(1.15)}\n.f-dawn{filter:sepia(.3) hue-rotate(-30deg) brightness(1.02) saturate(1.15)}\n\n/* ===== タイトル ===== */\n#scr-title .bgimg{filter:brightness(.8) saturate(1.05)}\n#title-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;background:linear-gradient(180deg,rgba(8,9,12,.15) 30%,rgba(8,9,12,.75))}\n#title-logo{text-align:center;color:#fff;margin-bottom:.6em}\n#title-logo h1{font-size:3.4em;font-weight:700;letter-spacing:.14em;text-indent:.14em;line-height:1.2;text-shadow:0 .15em 1.4em rgba(0,0,0,.7)}\n#title-logo p{font-size:1em;letter-spacing:.6em;text-indent:.6em;margin-top:.7em;color:var(--sun);text-shadow:0 .1em .6em rgba(0,0,0,.8)}\n.tbtn{font-family:inherit;white-space:nowrap;font-size:1.05em;padding:.7em 2.6em;border:1px solid transparent;border-radius:2em;cursor:pointer;background:var(--sun);color:#241a08;font-weight:700;letter-spacing:.2em;text-indent:.2em;box-shadow:0 .5em 1.8em rgba(240,185,74,.25);transition:transform .15s, box-shadow .15s, background .15s}\n.tbtn:hover{transform:translateY(-.1em);box-shadow:0 .7em 2.2em rgba(240,185,74,.4)}\n.tbtn:active{transform:translateY(.06em)}\n.tbtn.sub{background:rgba(255,255,255,.1);border-color:var(--line);color:#fff;font-size:.9em;box-shadow:none;backdrop-filter:blur(10px)}\n.tbtn.sub:hover{background:rgba(255,255,255,.18);box-shadow:none}\n#namebox{display:none;flex-direction:column;align-items:center;gap:.9em;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);padding:1.6em 2.4em;border-radius:1.2em;box-shadow:0 1em 3em rgba(0,0,0,.55)}\n#namebox label{font-weight:700;color:var(--txt);letter-spacing:.06em}\n#namebox input{font-family:inherit;font-size:1.15em;text-align:center;padding:.5em .6em;border:1px solid var(--line);border-radius:.7em;width:11em;background:rgba(255,255,255,.07);color:#fff;outline:none;transition:border-color .15s}\n#namebox input:focus{border-color:var(--sun)}\n#title-ver{position:absolute;bottom:1em;right:1.4em;color:rgba(255,255,255,.5);font-size:.72em;letter-spacing:.04em}\n\n/* ===== マップ ===== */\n#scr-map .bgimg{filter:brightness(.85)}\n#hud{position:absolute;top:.7em;left:.8em;right:.8em;display:flex;align-items:center;gap:.9em;padding:.5em .9em;background:var(--glass);border:1px solid var(--line);border-radius:1em;backdrop-filter:blur(16px);color:#fff;z-index:5;box-shadow:0 .4em 1.6em rgba(0,0,0,.35)}\n#hud .stat{display:flex;align-items:center;gap:.35em;font-weight:700;font-size:.95em}\n#hud .stat .ic{opacity:.95}\n#hud-spacer{flex:1}\n.hudbtn{font-family:inherit;white-space:nowrap;font-size:.82em;padding:.42em 1em;border:1px solid var(--line);border-radius:2em;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;font-weight:700;backdrop-filter:blur(10px);transition:background .15s}\n.hudbtn:hover{background:rgba(255,255,255,.18)}\n#map-locs{position:absolute;inset:0;padding:14% 5% 10%;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:3.5% 3%;align-content:center;z-index:2;overflow-y:auto}\n@media (orientation:portrait){\n  #map-locs{grid-template-columns:repeat(2,1fr);padding:19% 4% 14%}\n  #hud{flex-wrap:wrap;row-gap:.3em}\n  #nv-cast{gap:.8em;bottom:38%;padding:0 2vw}\n  .portrait .pimg,.portrait .pini{width:8em;height:8em}\n  /* 立ち絵が3人・4人になったときだけ縮小して見切れを防ぐ(1〜2人はサイズ据え置き) */\n  #nv-cast:has(.portrait:nth-child(3)) .pimg,\n  #nv-cast:has(.portrait:nth-child(3)) .pini{width:6.6em;height:6.6em}\n  #nv-cast:has(.portrait:nth-child(3)) .pini{font-size:3.3em}\n  #nv-cast:has(.portrait:nth-child(4)) .pimg,\n  #nv-cast:has(.portrait:nth-child(4)) .pini{width:5em;height:5em}\n  #nv-cast:has(.portrait:nth-child(4)) .pini{font-size:2.5em}\n  #nv-window{height:34%}\n  .stat-grid{grid-template-columns:1fr}\n  /* #party-bar のチップがはみ出す場合は横スクロールで対応(情報が切れないように) */\n  #party-bar{overflow-x:auto;justify-content:flex-start;padding-left:3%;padding-right:3%}\n}\n.loc{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:1em;padding:1em .7em .8em;text-align:center;cursor:pointer;color:#fff;backdrop-filter:blur(14px);box-shadow:0 .4em 1.4em rgba(0,0,0,.35);transition:transform .15s, border-color .15s, background .15s}\n.loc:hover{transform:translateY(-.2em);border-color:rgba(240,185,74,.75);background:rgba(28,30,38,.8)}\n.loc .lic{font-size:1.7em;line-height:1}\n.loc .lname{font-weight:700;margin-top:.35em;font-size:.95em}\n.loc .ldesc{font-size:.68em;color:var(--dim);margin-top:.2em}\n.loc .badge{position:absolute;top:-.5em;right:-.35em;background:#e85d4a;color:#fff;font-size:.7em;font-weight:700;padding:.2em .6em;border-radius:1em;box-shadow:0 0 .8em rgba(232,93,74,.6);animation:pulse 1.2s infinite}\n.loc .badge.q{background:var(--sea-d);box-shadow:0 0 .8em rgba(46,127,163,.6)}\n@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}\n.loc.closed{opacity:.45;filter:grayscale(.7)}\n#party-bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:.8em;padding:.6em 0 .8em;background:linear-gradient(0deg,rgba(8,9,12,.75),transparent);z-index:4}\n.pchip{white-space:nowrap;display:flex;align-items:center;gap:.5em;background:var(--glass);border:1px solid var(--line);border-radius:2em;padding:.28em 1em .28em .3em;backdrop-filter:blur(12px);color:#fff;box-shadow:0 .2em .8em rgba(0,0,0,.4)}\n.pchip img,.pchip .pini{width:2em;height:2em;border-radius:50%;object-fit:cover;border:1px solid var(--line)}\n.pchip .hearts{font-size:.72em;color:#ff7d9c;letter-spacing:.05em}\n.pchip .pnm{font-size:.8em;font-weight:700}\n\n/* ===== ノベル ===== */\n#scr-novel{z-index:10}\n#nv-cast{position:absolute;left:0;right:0;bottom:34%;display:flex;justify-content:center;align-items:flex-end;gap:2.5em;z-index:2;pointer-events:none}\n.portrait{display:flex;flex-direction:column;align-items:center;gap:.4em;transition:all .35s;filter:brightness(.5) saturate(.6);transform:scale(.86) translateY(.5em)}\n.portrait.active{filter:brightness(1);transform:scale(1.06) translateY(0)}\n.portrait .pimg{width:11em;height:11em;border-radius:50%;object-fit:cover;border:.16em solid rgba(255,255,255,.85);box-shadow:0 .6em 2em rgba(0,0,0,.55)}\n.portrait.active .pimg{border-color:var(--sun);box-shadow:0 0 2em rgba(240,185,74,.45),0 .6em 2em rgba(0,0,0,.55)}\n.portrait .pini{width:11em;height:11em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4em;color:#fff;font-weight:700;border:.05em solid rgba(255,255,255,.85);box-shadow:0 .12em .5em rgba(0,0,0,.5)}\n#nv-window{position:absolute;left:4%;right:4%;bottom:3%;height:30%;background:var(--win);border:1px solid var(--line);border-radius:1.1em;z-index:3;cursor:pointer;box-shadow:0 .8em 2.5em rgba(0,0,0,.5);backdrop-filter:blur(18px)}\n#nv-name{position:absolute;top:-1.15em;left:1.3em;background:var(--sun);color:#241a08;font-weight:700;padding:.28em 1.3em;border-radius:2em;font-size:1em;letter-spacing:.1em;box-shadow:0 .3em 1em rgba(0,0,0,.4)}\n#nv-name:empty{display:none}\n#nv-text{padding:1.3em 1.5em;color:var(--txt);font-size:1.12em;line-height:1.8;height:100%;overflow-y:auto}\n#nv-next{position:absolute;right:1.1em;bottom:.7em;color:var(--sun);animation:bob 1s infinite;font-size:1em}\n@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.25em)}}\n#nv-choices{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);display:none;flex-direction:column;gap:.7em;z-index:6;min-width:46%}\n.chbtn{font-family:inherit;white-space:nowrap;font-size:1.05em;padding:.65em 1.6em;border:1px solid var(--line);border-radius:2em;cursor:pointer;background:var(--glass);backdrop-filter:blur(14px);color:var(--txt);font-weight:700;box-shadow:0 .4em 1.4em rgba(0,0,0,.4);transition:all .15s;text-align:center}\n.chbtn:hover:not(:disabled){background:var(--sun);border-color:var(--sun);color:#241a08}\n.chbtn:disabled{opacity:.4;cursor:not-allowed}\n#nv-skip{position:absolute;top:.9em;right:1em;z-index:7}\n#nv-toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:.4em;align-items:center;pointer-events:none}\n.toast{background:var(--glass);color:var(--sun);font-weight:700;padding:.45em 1.4em;border-radius:2em;border:1px solid rgba(240,185,74,.55);backdrop-filter:blur(12px);animation:tin .3s;font-size:.95em}\n@keyframes tin{from{opacity:0;transform:translateY(-.6em)}to{opacity:1;transform:none}}\n\n/* ===== モーダル ===== */\n.modal{position:absolute;inset:0;background:rgba(5,6,9,.6);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(4px)}\n.modal.on{display:flex}\n.mbox{background:rgba(18,20,27,.92);border:1px solid var(--line);border-radius:1.2em;padding:1.5em 1.7em;max-width:80%;max-height:86%;overflow-y:auto;box-shadow:0 1.5em 4em rgba(0,0,0,.7);min-width:50%;color:var(--txt);backdrop-filter:blur(20px)}\n.mbox h2{color:#fff;border-bottom:1px solid var(--line);padding-bottom:.45em;margin-bottom:.9em;font-size:1.2em;letter-spacing:.12em;font-weight:700}\n.mbox h3{color:var(--sun);margin:1em 0 .45em;font-size:.92em;letter-spacing:.08em}\n.mclose{float:right;font-family:inherit;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);font-weight:700;border-radius:2em;padding:.3em .9em;cursor:pointer;font-size:.85em;transition:background .15s}\n.mclose:hover{background:rgba(255,255,255,.16)}\n.mrow{display:flex;gap:.6em;align-items:center;margin:.55em 0;flex-wrap:wrap}\n.mrow label{font-weight:700;min-width:7em;font-size:.9em}\n.mrow input[type=text],.mrow input[type=password],.mrow select{font-family:inherit;font-size:.95em;padding:.4em .6em;border:1px solid var(--line);border-radius:.6em;flex:1;background:rgba(255,255,255,.06);color:var(--txt);min-width:10em;outline:none;transition:border-color .15s}\n.mrow input:focus,.mrow select:focus{border-color:var(--sun)}\n.mrow select option{background:#161922;color:#f2efe9}\n.sbtn{font-family:inherit;white-space:nowrap;font-size:.9em;padding:.5em 1.2em;border:1px solid var(--line);border-radius:2em;cursor:pointer;background:rgba(255,255,255,.08);color:var(--txt);font-weight:700;transition:background .15s}\n.sbtn:hover{background:rgba(255,255,255,.16)}\n.sbtn:active{transform:translateY(.08em)}\n.sbtn.warn{background:rgba(220,80,60,.16);border-color:rgba(232,93,74,.5);color:#ff9d8c}\n.sbtn.warn:hover{background:rgba(220,80,60,.3)}\n.sbtn.gold{background:var(--sun);border-color:var(--sun);color:#241a08}\n.sbtn.gold:hover{background:#f6c96e}\n.note{font-size:.78em;color:var(--dim);line-height:1.6;margin:.4em 0}\ntextarea.ta{width:100%;font-family:monospace;font-size:.8em;border:1px solid var(--line);border-radius:.7em;padding:.6em;background:rgba(255,255,255,.05);color:var(--txt);resize:vertical;outline:none}\ntextarea.ta:focus{border-color:var(--sun)}\n\n/* ステータス */\n.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9em}\n.stat-card{background:rgba(255,255,255,.05);border:1px solid var(--line-soft);border-radius:1em;padding:.9em;display:flex;gap:.9em;align-items:flex-start}\n.stat-card img,.stat-card .pini{width:4.6em;height:4.6em;border-radius:50%;object-fit:cover;flex-shrink:0;border:.13em solid var(--sun)}\n.stat-card .scb{flex:1}\n.stat-card .scn{font-weight:700;font-size:1.05em}\n.stat-card .scr{font-size:.75em;color:var(--dim);margin:.15em 0 .3em}\n.stat-card .sch{color:#ff7d9c;font-size:.85em}\n.stat-card .scd{font-size:.78em;line-height:1.6;margin-top:.35em;color:var(--dim)}\n.itemrow{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line-soft);border-radius:.8em;padding:.55em .9em;margin:.45em 0}\n.itemrow .inm{font-weight:700;font-size:.95em}\n.itemrow .idc{font-size:.75em;color:var(--dim)}\n\n/* AIトーク */\n#ai-log{height:16em;overflow-y:auto;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:.9em;padding:.8em;margin:.6em 0}\n.aimsg{display:flex;gap:.6em;margin:.6em 0;align-items:flex-start}\n.aimsg .aport{width:2.6em;height:2.6em;border-radius:50%;object-fit:cover;flex-shrink:0}\n.aimsg .abody{background:rgba(255,255,255,.08);border-radius:1em;padding:.55em .9em;font-size:.9em;line-height:1.65;max-width:80%}\n.aimsg.me{flex-direction:row-reverse}\n.aimsg.me .abody{background:rgba(74,163,201,.28)}\n.aimsg .anm{font-size:.72em;font-weight:700;color:var(--sun);margin-bottom:.2em}\n#ai-input-row{display:flex;gap:.5em}\n#ai-input{flex:1;font-family:inherit;font-size:.95em;padding:.5em .9em;border:1px solid var(--line);border-radius:2em;background:rgba(255,255,255,.06);color:var(--txt);outline:none;transition:border-color .15s}\n#ai-input:focus{border-color:var(--sun)}\n.chk{display:inline-flex;align-items:center;gap:.3em;margin-right:.9em;font-size:.9em;font-weight:700;cursor:pointer}\n.chk input{accent-color:var(--sun)}\n.spin{display:inline-block;width:1em;height:1em;border:.18em solid var(--sun);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}\n@keyframes sp{to{transform:rotate(360deg)}}\n#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:30}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"stage\"><div id=\"game\">\n\n  <!-- タイトル -->\n  <div class=\"screen on\" id=\"scr-title\">\n    <div class=\"bgimg\" id=\"title-bg\"><\u002Fdiv>\n    <div id=\"title-inner\">\n      <div id=\"title-logo\">\n        <h1>ファルダゴ冒険譚<\u002Fh1>\n        <p>〜 乾杯日和 〜<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"tbtn\" id=\"btn-new\">はじめから<\u002Fbutton>\n      <button class=\"tbtn sub\" id=\"btn-continue\" style=\"display:none\">つづきから<\u002Fbutton>\n      <button class=\"tbtn sub\" id=\"btn-load-title\">バックアップ読込<\u002Fbutton>\n      <div id=\"namebox\">\n        <label>あなたの名前は?<\u002Flabel>\n        <input type=\"text\" id=\"inp-name\" maxlength=\"8\" value=\"アー\" placeholder=\"名前を入力\">\n        <button class=\"tbtn\" id=\"btn-start\">島に上陸する<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"title-ver\">ファルダゴ冒険譚 v1.0 / 原作: ファルダゴ乾杯日和(派生企画)<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- マップ -->\n  <div class=\"screen\" id=\"scr-map\">\n    <div class=\"bgimg\" id=\"map-bg\"><\u002Fdiv>\n    <div id=\"hud\">\n      <div class=\"stat\"><span class=\"ic\">📅<\u002Fspan><span id=\"hud-day\"><\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><span class=\"ic\">🕐<\u002Fspan><span id=\"hud-time\"><\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><span class=\"ic\">💰<\u002Fspan><span id=\"hud-money\"><\u002Fspan>G<\u002Fdiv>\n      <div id=\"hud-spacer\"><\u002Fdiv>\n      <button class=\"hudbtn\" id=\"btn-status\">なかま<\u002Fbutton>\n      <button class=\"hudbtn\" id=\"btn-items\">もちもの<\u002Fbutton>\n      <button class=\"hudbtn\" id=\"btn-ai\">AIトーク<\u002Fbutton>\n      <button class=\"hudbtn\" id=\"btn-save\">セーブ<\u002Fbutton>\n      <button class=\"hudbtn\" id=\"btn-settings\">設定<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"map-locs\"><\u002Fdiv>\n    <div id=\"party-bar\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ノベル -->\n  <div class=\"screen\" id=\"scr-novel\">\n    <div class=\"bgimg\" id=\"nv-bg\"><\u002Fdiv>\n    <div id=\"nv-toast\"><\u002Fdiv>\n    <div id=\"nv-cast\"><\u002Fdiv>\n    <button class=\"hudbtn\" id=\"nv-skip\">スキップ ≫<\u002Fbutton>\n    <div id=\"nv-choices\"><\u002Fdiv>\n    <div id=\"nv-window\">\n      <div id=\"nv-name\"><\u002Fdiv>\n      <div id=\"nv-text\"><\u002Fdiv>\n      <div id=\"nv-next\">▼<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- なかま -->\n  <div class=\"modal\" id=\"md-status\"><div class=\"mbox\">\n    <button class=\"mclose\" data-close=\"md-status\">✕ とじる<\u002Fbutton>\n    <h2>なかま<\u002Fh2>\n    <div class=\"stat-grid\" id=\"status-grid\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <!-- もちもの -->\n  <div class=\"modal\" id=\"md-items\"><div class=\"mbox\">\n    <button class=\"mclose\" data-close=\"md-items\">✕ とじる<\u002Fbutton>\n    <h2>もちもの<\u002Fh2>\n    <div id=\"items-list\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <!-- セーブ/ロード -->\n  <div class=\"modal\" id=\"md-save\"><div class=\"mbox\">\n    <button class=\"mclose\" data-close=\"md-save\">✕ とじる<\u002Fbutton>\n    <h2>セーブ / バックアップ<\u002Fh2>\n    <div class=\"note\">ゲームはこの端末(ブラウザ)に自動セーブされます。別の端末に持っていくときや、念のための控えにはバックアップファイルを使ってください。<\u002Fdiv>\n    <div class=\"mrow\">\n      <button class=\"sbtn gold\" id=\"btn-save-now\">💾 いますぐセーブ<\u002Fbutton>\n      <span class=\"note\" id=\"save-status\"><\u002Fspan>\n    <\u002Fdiv>\n    <h3>バックアップ<\u002Fh3>\n    <div class=\"mrow\">\n      <button class=\"sbtn\" id=\"btn-save-dl\">⬇ ファイルに書き出す<\u002Fbutton>\n      <button class=\"sbtn\" id=\"btn-load-file\">📂 ファイルから読み込む<\u002Fbutton>\n      <input type=\"file\" id=\"inp-load-file\" accept=\".json\" style=\"display:none\">\n    <\u002Fdiv>\n    <h3>貼り付けで読み込み<\u002Fh3>\n    <textarea class=\"ta\" id=\"ta-save\" rows=\"4\" placeholder=\"ここにバックアップJSONを貼り付け\"><\u002Ftextarea>\n    <div class=\"mrow\"><button class=\"sbtn\" id=\"btn-load-paste\">貼り付けた内容を読み込む<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <!-- 設定 -->\n  <div class=\"modal\" id=\"md-settings\"><div class=\"mbox\">\n    <button class=\"mclose\" data-close=\"md-settings\">✕ とじる<\u002Fbutton>\n    <h2>設定<\u002Fh2>\n    <h3>AI連携<\u002Fh3>\n    <div class=\"mrow\"><label>AI機能<\u002Flabel>\n      <select id=\"sel-aion\"><option value=\"off\">OFF(内蔵の定型会話)<\u002Foption><option value=\"on\">ON(APIで自由会話)<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"mrow\"><label>AIサービス<\u002Flabel>\n      <select id=\"sel-provider\">\n        <option value=\"claude\">Claude API<\u002Foption>\n        <option value=\"gemini\">Gemini API<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"mrow\"><label>APIキー<\u002Flabel><input type=\"password\" id=\"inp-apikey\" placeholder=\"APIキーを入力\"><\u002Fdiv>\n    <div class=\"mrow\"><label>モデル<\u002Flabel><input type=\"text\" id=\"inp-model\" placeholder=\"空欄で標準モデル\"><\u002Fdiv>\n    <div class=\"mrow\"><button class=\"sbtn\" id=\"btn-api-test\">接続テスト<\u002Fbutton><span id=\"api-test-result\" class=\"note\"><\u002Fspan><\u002Fdiv>\n    <div class=\"note\">APIキーはこの端末のブラウザ内にだけ保存されます(バックアップファイルには含まれません)。応答が12秒を超えたときは、自動で内蔵の定型会話に切り替わります。<\u002Fdiv>\n    <h3>追加シナリオ<\u002Fh3>\n    <div class=\"note\">シナリオエディタで作成したJSONを読み込むと、イベントが追加されます。<\u002Fdiv>\n    <div class=\"mrow\">\n      <button class=\"sbtn\" id=\"btn-scn-import\">📂 追加シナリオを読み込む<\u002Fbutton>\n      <button class=\"sbtn warn\" id=\"btn-scn-clear\" style=\"font-size:.8em\">削除<\u002Fbutton>\n      <input type=\"file\" id=\"inp-scn-file\" accept=\".json\" style=\"display:none\">\n      <span class=\"note\" id=\"scn-status\">追加シナリオ: なし<\u002Fspan>\n    <\u002Fdiv>\n    <h3>その他<\u002Fh3>\n    <div class=\"mrow\">\n      <label>文字送り速度<\u002Flabel>\n      <select id=\"sel-speed\"><option value=\"28\">ふつう<\u002Foption><option value=\"14\">はやい<\u002Foption><option value=\"0\">一瞬<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"mrow\"><button class=\"sbtn warn\" id=\"btn-title-back\">タイトルに戻る<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <!-- AIトーク -->\n  <div class=\"modal\" id=\"md-ai\"><div class=\"mbox\" style=\"min-width:72%\">\n    <button class=\"mclose\" data-close=\"md-ai\">✕ とじる<\u002Fbutton>\n    <h2>共用スペースにて<\u002Fh2>\n    <div id=\"ai-nokey\" class=\"note\" style=\"display:none\">いまは内蔵の定型会話モードです。「設定」でAI機能をONにしてAPIキーを入れると、自由な会話ができます。<\u002Fdiv>\n    <div>\n      <span style=\"font-weight:bold;font-size:.9em\">いる人: <\u002Fspan>\n      <label class=\"chk\"><input type=\"checkbox\" class=\"ai-char\" value=\"leo\" checked=\"\">レオ<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" class=\"ai-char\" value=\"tiera\" checked=\"\">ティエラ<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" class=\"ai-char\" value=\"wayne\" checked=\"\">ウェイン<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" class=\"ai-char\" value=\"romdo\" checked=\"\">ロムド<\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"ai-log\"><\u002Fdiv>\n    <div id=\"ai-input-row\">\n      <input type=\"text\" id=\"ai-input\" placeholder=\"話しかける(空欄で送信するとみんなの雑談)\">\n      <button class=\"sbtn gold\" id=\"btn-ai-send\">送信<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"mrow\"><button class=\"sbtn\" id=\"btn-ai-clear\" style=\"font-size:.8em\">履歴クリア<\u002Fbutton><span class=\"note\" id=\"ai-status\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div id=\"fade\"><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<script>\nconst ASSETS={\"leo\": \"data:image/jpeg;base64,/9j/4QDKRXhpZgAATU0AKgAAAAgABgESAAMAAAABAAEAAAEaAAUAAAABAAAAVgEbAAUAAAABAAAAXgEoAAMAAAABAAIAAAITAAMAAAABAAEAAIdpAAQAAAABAAAAZgAAAAAAAABIAAAAAQAAAEgAAAABAAeQAAAHAAAABDAyMjGRAQAHAAAABAECAwCgAAAHAAAABDAxMDCgAQADAAAAAQABAACgAgAEAAAAAQAAAXegAwAEAAAAAQAAAXekBgADAAAAAQAAAAAAAAAAAAD/4gIoSUNDX1BST0ZJTEUAAQEAAAIYYXBwbAQAAABtbnRyUkdCIFhZWiAH5gABAAEAAAAAAABhY3NwQVBQTAAAAABBUFBMAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWFwcGwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAApkZXNjAAAA/AAAADBjcHJ0AAABLAAAAFB3dHB0AAABfAAAABRyWFlaAAABkAAAABRnWFlaAAABpAAAABRiWFlaAAABuAAAABRyVFJDAAABzAAAACBjaGFkAAAB7AAAACxiVFJDAAABzAAAACBnVFJDAAABzAAAACBtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABQAAAAcAEQAaQBzAHAAbABhAHkAIABQADNtbHVjAAAAAAAAAAEAAAAMZW5VUwAAADQAAAAcAEMAbwBwAHkAcgBpAGcAaAB0ACAAQQBwAHAAbABlACAASQBuAGMALgAsACAAMgAwADIAMlhZWiAAAAAAAAD21QABAAAAANMsWFlaIAAAAAAAAIPfAAA9v////7tYWVogAAAAAAAASr8AALE3AAAKuVhZWiAAAAAAAAAoOAAAEQsAAMi5cGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltzZjMyAAAAAAABDEIAAAXe///zJgAAB5MAAP2Q///7ov///aMAAAPcAADAbv/bAIQAAQEBAQEBAgEBAgMCAgIDBAMDAwMEBQQEBAQEBQYFBQUFBQUGBgYGBgYGBgcHBwcHBwgICAgICQkJCQkJCQkJCQEBAQECAgIEAgIECQYFBgkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJ/90ABAAY/8AAEQgBdwF3AwEiAAIRAQMRAf/EAaIAAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKCxAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4
