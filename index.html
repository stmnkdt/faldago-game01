own_night:{img:\"bg_town\",f:\"f-night\",  label:\"夜の町\"},\n  town_dawn: {img:\"bg_town\",f:\"f-dawn\",   label:\"朝の町\"},\n  port:      {img:\"bg_port\",f:\"f-none\",   label:\"港\"},\n  port_eve:  {img:\"bg_port\",f:\"f-eve\",    label:\"夕方の港\"},\n  port_night:{img:\"bg_port\",f:\"f-night\",  label:\"夜の港\"},\n  interior:  {img:\"bg_town\",f:\"f-interior\",label:\"室内\"},\n  ruins:     {img:\"bg_port\",f:\"f-ruins\",  label:\"遺跡島\"},\n  ruins_deep:{img:\"bg_port\",f:\"f-deep\",   label:\"遺跡島・奥地\"}\n};\n\n/* ---------- 場所定義 ---------- */\nconst LOCS=[\n  {id:\"workshop\",ic:\"🔧\", name:\"レオの魔導具工房\",desc:\"夜遅くまで灯りが名物\"},\n  {id:\"diner\",   ic:\"🍲\", name:\"食堂\",           desc:\"ウェインの実家。看板は煮込み\"},\n  {id:\"shop\",    ic:\"💍\", name:\"装飾品店\",       desc:\"淡い薄紅の壁。ティエラの店\"},\n  {id:\"plaza\",   ic:\"⛲\", name:\"広場\",           desc:\"円い噴水。よく誰かがいる\"},\n  {id:\"bureau\",  ic:\"🏛️\", name:\"遺跡管理局\",     desc:\"苔緑の壁。ウェインの職場\"},\n  {id:\"guild\",   ic:\"📜\", name:\"ギルド連合本部\", desc:\"ロムドの職場。依頼が集まる\"},\n  {id:\"commons\", ic:\"🍻\", name:\"共用スペース\",   desc:\"大きなテーブル。夜は乾杯の場\"},\n  {id:\"port\",    ic:\"⚓\", name:\"港\",             desc:\"木の桟橋。遺跡島行きの船が出る\"},\n  {id:\"inn\",     ic:\"🛏️\", name:\"宿\",             desc:\"休んで日を進める\"}\n];\n\n/* ---------- アイテム定義 ---------- */\nconst ITEMS={\n  charm:   {name:\"幸運のお守り\",   desc:\"ティエラの店の一品。探索の判定に+10\",  price:300, bonus:10},\n  compass: {name:\"魔導コンパス\",   desc:\"レオ作。遺跡島で迷いにくくなる。判定+15\",price:500, bonus:15},\n  bento:   {name:\"食堂の弁当\",     desc:\"ウェイン特製。遺跡島で1回だけ失敗を帳消しにする\",price:200, revive:true},\n  ticket:  {name:\"渡航許可証\",     desc:\"遺跡島への同行渡航に必要。管理局発行\",  price:0},\n  gem_r:   {name:\"赤の遺輝石\",     desc:\"遺跡島で見つかる貴石。売ると300G\",     sell:300},\n  gem_b:   {name:\"蒼の遺輝石\",     desc:\"遺跡島で見つかる貴石。売ると500G\",     sell:500},\n  relic:   {name:\"古代の歯車\",     desc:\"精巧な古代部品。レオが喜びそうだ\",     sell:150},\n  flower:  {name:\"星詠み草\",       desc:\"遺跡島にだけ咲く花。ティエラが喜びそうだ\",sell:100},\n  meat:    {name:\"謎の魔獣肉\",     desc:\"……ウェインなら料理できる。たぶん\",    sell:80},\n  oldcoin: {name:\"古代金貨\",       desc:\"ロムドが好きそうな古い意匠の金貨\",     sell:200}\n};\n\n/* ---------- ゲーム状態 ---------- */\nlet S=null;\nfunction newState(name){return{\n  name:name||\"アー\", day:1, time:0, money:500,\n  aff:{leo:0,tiera:0,wayne:0,romdo:0},\n  items:{}, flags:{}, done:{}, endingSeen:false,\n  qevent:{day:0,loc:null,resolved:false}\n};}\nconst TIMES=[\"朝\",\"昼\",\"夜\"];\nfunction fmtDay(){return `${S.day}日目`;}\n\n/* ---------- 画面制御 ---------- */\nfunction show(id){document.querySelectorAll(\".screen\").forEach(s=>s.classList.remove(\"on\"));$(id).classList.add(\"on\");}\nfunction fade(fn){const f=$(\"fade\");f.style.opacity=1;setTimeout(()=>{fn();f.style.opacity=0;},480);}\nfunction openModal(id){$(id).classList.add(\"on\");}\nfunction closeModal(id){$(id).classList.remove(\"on\");}\ndocument.querySelectorAll(\".mclose\").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));\n\n/* ---------- 背景適用 ---------- */\nfunction setBG(el,bgId){const b=BGS[bgId]||BGS.town;el.style.backgroundImage=`url(${ASSETS[b.img]})`;el.className=\"bgimg \"+b.f;}\n\n/* ---------- トースト ---------- */\nfunction toast(msg){const t=document.createElement(\"div\");t.className=\"toast\";t.textContent=msg;$(\"nv-toast\").appendChild(t);setTimeout(()=>t.remove(),2600);}\n\n/* ---------- 効果適用 ---------- */\nfunction applyFx(fx){\n  if(!fx)return;\n  if(fx.aff)for(const k in fx.aff){S.aff[k]=Math.max(0,(S.aff[k]||0)+fx.aff[k]);const v=fx.aff[k];toast(`${CHARS[k].name}の好感度 ${v>0?\"+\":\"\"}${v}`);}\n  if(fx.money){S.money+=fx.money;toast(`${fx.money>0?\"+\":\"\"}${fx.money}G`);}\n  if(fx.item){S.items[fx.item]=(S.items[fx.item]||0)+1;toast(`「${ITEMS[fx.item].name}」を手に入れた`);}\n  if(fx.loseItem&&S.items[fx.loseItem]){S.items[fx.loseItem]--;if(S.items[fx.loseItem]<=0)delete S.items[fx.loseItem];}\n  if(fx.flag)S.flags[fx.flag]=true;\n  if(fx.unflag)delete S.flags[fx.unflag];\n  if(fx.time)advanceTime(fx.time);\n}\nfunction advanceTime(n){\n  for(let i=0;i<n;i++){S.time++;if(S.time>2){S.time=0;S.day++;}}\n}\n\n/* ---------- 条件判定 ---------- */\nfunction condOK(c){\n  if(!c)return true;\n  if(c.day&&S.day<c.day)return false;\n  if(c.maxDay&&S.day>c.maxDay)return false;\n  if(c.time!==undefined&&c.time!==null&&c.time!==\"\"&&S.time!==+c.time)return false;\n  if(c.aff)for(const k in c.aff)if((S.aff[k]||0)<c.aff[k])return false;\n  if(c.flag&&!S.flags[c.flag])return false;\n  if(c.notflag&&S.flags[c.notflag])return false;\n  if(c.money&&S.money<c.money)return false;\n  return true;\n}\n\n/* ---------- ノベルプレイヤー ---------- */\nlet NV={scenes:[],i:0,typing:false,timer:null,onEnd:null,cast:[],speed:28};\nfunction speakerName(sp){\n  if(sp===\"pl\")return S.name;\n  if(sp===\"n\"||!sp)return \"\";\n  return (CHARS[sp]||{name:sp}).name;\n}\nfunction txt(t){return t.replace(/\\{name\\}/g,S.name);}\n\nfunction startScenes(scenes,onEnd){\n  NV.scenes=scenes;NV.i=0;NV.onEnd=onEnd;\n  NV.cast=[...new Set(scenes.filter(s=>s.sp&&s.sp!==\"n\"&&s.sp!==\"pl\"&&CHARS[s.sp]).map(s=>s.sp))].slice(0,4);\n  show(\"scr-novel\");\n  buildCast();\n  playScene();\n}\nfunction buildCast(){\n  const c=$(\"nv-cast\");c.innerHTML=\"\";\n  NV.cast.forEach(id=>{\n    const ch=CHARS[id];\n    const d=document.createElement(\"div\");d.className=\"portrait\";d.dataset.ch=id;\n    if(ch.img)d.innerHTML=`<img class=\"pimg\" src=\"${ASSETS[ch.img]}\" alt=\"${ch.name}\">`;\n    else d.innerHTML=`<div class=\"pini\" style=\"background:${ch.color}\">${ch.ini||\"?\"}<\u002Fdiv>`;\n    c.appendChild(d);\n  });\n}\nfunction playScene(){\n  const sc=NV.scenes[NV.i];\n  if(!sc){endScenes();return;}\n  if(sc.bg)setBG($(\"nv-bg\"),sc.bg);\n  if(sc.fx)applyFx(sc.fx);\n  // 話者ハイライト\n  document.querySelectorAll(\"#nv-cast .portrait\").forEach(p=>p.classList.toggle(\"active\",p.dataset.ch===sc.sp));\n  $(\"nv-name\").textContent=speakerName(sc.sp);\n  $(\"nv-name\").style.background=sc.sp&&CHARS[sc.sp]&&CHARS[sc.sp].color?`linear-gradient(180deg,${CHARS[sc.sp].color},#7a5a40)`:\"\";\n  typeText(txt(sc.text||\"\"),()=>{\n    if(sc.ch&&sc.ch.length)showChoices(sc.ch);\n  });\n}\nfunction typeText(t,done){\n  clearInterval(NV.timer);NV.typing=true;\n  const el=$(\"nv-text\");el.textContent=\"\";$(\"nv-next\").style.display=\"none\";$(\"nv-choices\").style.display=\"none\";\n  let i=0;const sp=NV.speed;\n  if(sp<=0){el.textContent=t;NV.typing=false;$(\"nv-next\").style.display=\"\";done&&done();return;}\n  NV.timer=setInterval(()=>{\n    el.textContent=t.slice(0,++i);\n    if(i>=t.length){clearInterval(NV.timer);NV.typing=false;$(\"nv-next\").style.display=\"\";done&&done();}\n  },sp);\n}\nfunction showChoices(chs){\n  const box=$(\"nv-choices\");box.innerHTML=\"\";box.style.display=\"flex\";\n  $(\"nv-next\").style.display=\"none\";\n  chs.forEach(c=>{\n    const b=document.createElement(\"button\");b.className=\"chbtn\";b.textContent=txt(c.t);\n    let dis=false,reason=\"\";\n    if(c.req){\n      if(c.req.money&&S.money<c.req.money){dis=true;reason=`(${c.req.money}G必要)`;}\n      if(c.req.item&&!S.items[c.req.item]){dis=true;reason=`(${ITEMS[c.req.item].name}が必要)`;}\n      if(c.req.flag&&!S.flags[c.req.flag]){dis=true;reason=\"(条件未達成)\";}\n    }\n    if(dis){b.disabled=true;b.textContent+=\" \"+reason;}\n    b.onclick=()=>{\n      box.style.display=\"none\";\n      if(c.fx)applyFx(c.fx);\n      if(c.jump!==undefined&&c.jump!==null&&c.jump!==\"\"){NV.i=+c.jump;playScene();}\n      else{NV.i++;playScene();}\n    };\n    box.appendChild(b);\n  });\n}\nfunction nextIndex(sc){return (sc.jump!==undefined&&sc.jump!==null&&sc.jump!==\"\")?+sc.jump:NV.i+1;}\nfunction advance(){\n  const sc=NV.scenes[NV.i];\n  if(!sc)return;\n  if(sc.ch&&sc.ch.length&&!NV.typing)return; // 選択肢待ち\n  if(NV.typing){clearInterval(NV.timer);$(\"nv-text\").textContent=txt(sc.text||\"\");NV.typing=false;$(\"nv-next\").style.display=\"\";if(sc.ch&&sc.ch.length)showChoices(sc.ch);return;}\n  NV.i=nextIndex(sc);playScene();\n}\nfunction endScenes(){\n  const f=NV.onEnd;NV.onEnd=null;\n  fade(()=>{if(f)f();else gotoMap();});\n}\n$(\"nv-window\").onclick=advance;\n$(\"nv-skip\").onclick=()=>{\n  // 次の選択肢まで飛ばす(暴走ガード付き)\n  let guard=0;\n  while(NV.i<NV.scenes.length&&guard++<300){\n    const sc=NV.scenes[NV.i];\n    if(sc.ch&&sc.ch.length){playScene();clearInterval(NV.timer);$(\"nv-text\").textContent=txt(sc.text||\"\");NV.typing=false;showChoices(sc.ch);return;}\n    if(sc.fx)applyFx(sc.fx);\n    NV.i=nextIndex(sc);\n  }\n  endScenes();\n};\n\n/* ---------- マップ ---------- */\nfunction timeBG(){return S.time===0?\"town_dawn\":S.time===1?\"town\":S.time===2?\"town_night\":\"town\";}\nfunction gotoMap(){\n  syncQEvent();\n  show(\"scr-map\");\n  setBG($(\"map-bg\"),timeBG());\n  $(\"hud-day\").textContent=fmtDay();\n  $(\"hud-time\").textContent=TIMES[S.time];\n  $(\"hud-money\").textContent=S.money;\n  const grid=$(\"map-locs\");grid.innerHTML=\"\";\n  LOCS.forEach(l=>{\n    const d=document.createElement(\"div\");d.className=\"loc\";\n    const ev=nextEventFor(l.id);\n    d.innerHTML=`<div class=\"lic\">${l.ic}<\u002Fdiv><div class=\"lname\">${l.name}<\u002Fdiv><div class=\"ldesc\">${l.desc}<\u002Fdiv>`;\n    if(ev&&(ev.prio||0)>=5){const b=document.createElement(\"div\");b.className=\"badge\";b.textContent=\"!\";d.appendChild(b);}\n    else if(isQEventHere(l.id)){const b=document.createElement(\"div\");b.className=\"badge q\";b.textContent=\"?\";d.appendChild(b);}\n    d.onclick=()=>visitLoc(l.id);\n    grid.appendChild(d);\n  });\n  const pb=$(\"party-bar\");pb.innerHTML=\"\";\n  MAIN4.forEach(id=>{\n    const ch=CHARS[id];const a=S.aff[id]||0;\n    const hearts=\"♥\".repeat(Math.min(10,Math.floor(a/2)))+\"♡\".repeat(Math.max(0,5-Math.floor(a/2)>0?Math.min(5,Math.max(0,5-Math.floor(a/2))):0));\n    const d=document.createElement(\"div\");d.className=\"pchip\";\n    d.innerHTML=`<img src=\"${ASSETS[ch.img]}\"><span class=\"pnm\">${ch.name}<\u002Fspan><span class=\"hearts\">${\"♥\".repeat(Math.min(8,Math.floor(a/3)))||\"♡\"}<small style=\"color:rgba(255,255,255,.55)\"> ${a}<\u002Fsmall><\u002Fspan>`;\n    pb.appendChild(d);\n  });\n  checkEnding();\n}\n\n/* ---------- イベント選択 ---------- */\nfunction allEvents(){return EVENTS.concat(CUSTOM_EVENTS);}\nfunction nextEventFor(loc){\n  const cands=allEvents().filter(e=>e.loc===loc&&!(e.once&&S.done[e.id])&&condOK(e.cond));\n  if(!cands.length)return null;\n  const top=Math.max(...cands.map(e=>e.prio||0));\n  return rnd(cands.filter(e=>(e.prio||0)===top));\n}\nfunction visitLoc(loc){\n  if(loc===\"inn\"){innMenu();return;}\n  if(loc===\"port\"){portMenu();return;}\n  const ev=nextEventFor(loc);\n  if(ev&&(ev.prio||0)>=5){runEvent(ev);return;}\n  if(isQEventHere(loc)){runQEvent(loc);return;}\n  if(ev){runEvent(ev);return;}\n  // 汎用フレーバー\n  const fl=FLAVOR[loc]||FLAVOR.plaza;\n  fade(()=>startScenes([{bg:fl.bg||timeNovelBG(),sp:\"n\",text:rnd(fl.texts)}],null));\n}\nfunction timeNovelBG(){return S.time===2?\"town_night\":S.time===0?\"town_dawn\":\"town\";}\nfunction runEvent(ev){\n  if(ev.once)S.done[ev.id]=true;\n  fade(()=>startScenes(JSON.parse(JSON.stringify(ev.scenes)),()=>{advanceTime(1);gotoMap();}));\n}\n\n/* ---------- 宿(日送り) ---------- */\nfunction innMenu(){\n  fade(()=>startScenes([\n    {bg:\"interior\",sp:\"n\",text:\"泊まっている宿の部屋。窓を開けると潮風が入ってくる。\",ch:[\n      {t:\"休んで次の日へ\",fx:{flag:\"_slept\"},jump:1},\n      {t:\"やっぱりやめる\",jump:2}\n    ]},\n    {bg:\"town_dawn\",sp:\"n\",text:\"……ぐっすり眠った。窓の外から、市場の呼び込みの声が聞こえてくる。新しい一日だ。\",jump:3},\n    {bg:\"interior\",sp:\"n\",text:\"宿の主人に会釈して、通りに戻った。\"}\n  ],()=>{\n    if(S.flags._slept){delete S.flags._slept;S.day++;S.time=0;}\n    gotoMap();\n  }));\n}\n\n/* ---------- AIイベント「?」 ---------- */\nconst QEVENT_CHANCE=0.25; /* 【要確認】出現確率は遊んでみて調整前提 */\nconst LOC_QCAST={\n  workshop:[\"leo\"], shop:[\"tiera\"], bureau:[\"wayne\"], guild:[\"romdo\"],\n  diner:[\"wayne\",\"leo\",\"tiera\",\"romdo\"], plaza:MAIN4, commons:MAIN4,\n  inn:MAIN4, port:[\"wayne\",\"romdo\"]\n};\nlet qBusy=false;\nfunction syncQEvent(){\n  if(!S.qevent)S.qevent={day:0,loc:null,resolved:false};\n  if(S.qevent.day!==S.day)rollQEvent();\n}\nfunction rollQEvent(){\n  S.qevent={day:S.day,loc:null,resolved:false};\n  if(!chance(QEVENT_CHANCE))return;\n  /* 宿・港は専用メニューがあるため対象外 */\n  const cands=LOCS.filter(l=>{\n    if(l.id===\"inn\"||l.id===\"port\")return false;\n    const ev=nextEventFor(l.id);\n    return !(ev&&(ev.prio||0)>=5);\n  });\n  if(cands.length)S.qevent.loc=rnd(cands).id;\n}\nfunction isQEventHere(loc){\n  return !!(S.qevent&&S.qevent.loc===loc&&!S.qevent.resolved&&S.time<2);\n}\nfunction qCandidates(loc){return LOC_QCAST[loc]||MAIN4;}\nfunction pickQParticipants(loc){\n  const pool=qCandidates(loc).slice();\n  const p1=rnd(pool);\n  const rest=pool.filter(x=>x!==p1);\n  const p2=(rest.length&&chance(.4))?rnd(rest):null;\n  return [p1,p2];\n}\nfunction affMaxed(id){return !!S.flags[id+\"_max\"];}\nfunction pickQEffect(parts){\n  if(!chance(.5))return null;\n  const cand=parts.filter(id=>id&&!affMaxed(id));\n  if(!cand.length)return null;\n  return rnd(cand);\n}\nfunction qBg(loc){return (FLAVOR[loc]&&FLAVOR[loc].bg)||timeNovelBG();}\n\n/* 内蔵ミニイベント(AI不使用・失敗時のフォールバック) */\nconst QEVENT_BUILTIN_SOLO=[\n  [{sp:\"n\",text:\"通りを歩いていると、後ろから声をかけられた。\"},\n   {sp:\"p1\",text:\"よう、{name}。奇遇だね。少しだけ付き合ってよ。\"},\n   {sp:\"n\",text:\"たわいもない話をして、また歩き出した。\"}],\n  [{sp:\"n\",text:\"{p1}が何かを一生懸命探しているようだった。\"},\n   {sp:\"p1\",text:\"{name}、ちょっとこれ見なかった? ……あ、あったあった。手伝ってくれてありがとう。\"}],\n  [{sp:\"n\",text:\"{p1}が空を見上げて、ぼんやり立っていた。\"},\n   {sp:\"p1\",text:\"{name}か。……いや、なんでもない。今日の雲、なんか形がおもしろいなって。\"}],\n  [{sp:\"pl\",text:\"(あれ、{p1}だ)\"},\n   {sp:\"p1\",text:\"あ、{name}。いいところに。ちょっと聞いてほしい話があるんだ。\"},\n   {sp:\"n\",text:\"他愛のない話をひとしきり聞いて、笑い合った。\"}],\n  [{sp:\"n\",text:\"{p1}が屋台の匂いに釣られて足を止めていた。\"},\n   {sp:\"p1\",text:\"{name}も気になる? ひとつ買ってみようかな。\"}],\n  [{sp:\"n\",text:\"{p1}が小さくあくびをしていた。\"},\n   {sp:\"p1\",text:\"{name}? ……ああ、ちょっと眠くて。でも{name}の顔見たら目が覚めた気がする。\"}]\n];\nconst QEVENT_BUILTIN_DUO=[\n  [{sp:\"n\",text:\"{p1}と{p2}が並んで立ち話をしていた。\"},\n   {sp:\"p1\",text:\"あ、{name}。ちょうどいま、噂してたんだよ。\"},\n   {sp:\"p2\",text:\"変なことは言ってないよ。……たぶん。\"}],\n  [{sp:\"n\",text:\"{p1}が{p2}に何かを見せていた。{name}に気づいて手を止める。\"},\n   {sp:\"p1\",text:\"{name}も見る? ……ま、大した話じゃないんだけどね。\"},\n   {sp:\"p2\",text:\"ふふ、それより{name}、今日はどうしたの?\"}]\n];\nfunction qSub(t,p1,p2){\n  return t.replace(/\\{p1\\}/g,CHARS[p1].name).replace(/\\{p2\\}/g,p2?CHARS[p2].name:\"\");\n}\nfunction buildQBuiltinScenes(p1,p2,bg){\n  const tmpl=p2?rnd(QEVENT_BUILTIN_DUO):rnd(QEVENT_BUILTIN_SOLO);\n  return tmpl.map(s=>({\n    bg,\n    sp:s.sp===\"p1\"?p1:(s.sp===\"p2\"?p2:s.sp),\n    text:qSub(s.text,p1,p2)\n  }));\n}\n/* 全角80字程度でシーン分割 */\nfunction splitQLong(text){\n  const LIMIT=80,parts=[];let s=text;\n  while(s.length>LIMIT){\n    let cut=s.lastIndexOf(\"。\",LIMIT);\n    cut=(cut<10)?LIMIT:cut+1;\n    parts.push(s.slice(0,cut));s=s.slice(cut);\n  }\n  if(s)parts.push(s);\n  return parts;\n}\nfunction parseQAIText(text,parts){\n  let arr;\n  try{const m=text.match(/\\[[\\s\\S]*\\]/);arr=JSON.parse(m?m[0]:text);}catch(e){return null;}\n  if(!Array.isArray(arr)||!arr.length)return null;\n  const out=[];\n  arr.forEach(item=>{\n    if(!item||typeof item.text!==\"string\"||!item.text.trim())return;\n    let sp=item.sp;\n    if(sp!==\"pl\"&&sp!==\"n\"&&!(parts.includes(sp)&&CHARS[sp]))sp=\"n\";\n    splitQLong(item.text.trim()).forEach(t=>out.push({sp,text:t}));\n  });\n  return out.length?out:null;\n}\nasync function buildQAIScenes(p1,p2,loc,bg){\n  const parts=[p1,p2].filter(Boolean);\n  const topic=rnd([\"最近あった小さな出来事\",\"今日の天気の話\",\"ちょっとした噂話\",\"おすすめの店の話\",\"昔の失敗談\",\"次の休みの予定\"]);\n  const locName=(LOCS.find(l=>l.id===loc)||{}).name||loc;\n  const prompt=`${PERSONA_DOC}\n\n場面: ${locName}\n参加キャラ: ${parts.join(\", \")}(このキャラだけが話す。他のキャラは出さない)\nプレイヤー名: ${S.name}\nお題: ${topic}\n\n上記の場面で、参加キャラと主人公が交わす短い一幕(2〜4行)を作ってください。\n出力形式は次のJSON配列のみで、説明文やコードブロックは付けないこと:\n[{\"sp\":\"キャラID\",\"text\":\"台詞\"}]\nspはキャラID(\"${parts.join('\",\"')}\")か、主人公なら\"pl\"、地の文なら\"n\"のみ使用可。`;\n  const raw=await callAI(prompt);\n  const parsed=parseQAIText(raw,parts);\n  if(!parsed)throw new Error(\"形式外の応答\");\n  return parsed.map(s=>({bg,sp:s.sp,text:s.text}));\n}\nasync function runQEvent(loc){\n  if(qBusy)return;\n  qBusy=true;\n  S.qevent.resolved=true;\n  toast(\"……\");\n  const [p1,p2]=pickQParticipants(loc);\n  const effectId=pickQEffect([p1,p2]);\n  const bg=qBg(loc);\n  let scenes=null;\n  if(CFG.aiOn&&CFG.key){\n    try{scenes=await buildQAIScenes(p1,p2,loc,bg);}catch(e){scenes=null;}\n  }\n  if(!scenes||!scenes.length)scenes=buildQBuiltinScenes(p1,p2,bg);\n  qBusy=false;\n  fade(()=>startScenes(scenes,()=>{\n    if(effectId)applyFx({aff:{[effectId]:1}});\n    else toast(\"今日は特に何も変わらなかった\");\n    advanceTime(1);gotoMap();\n  }));\n}\n<\u002Fscript>\n<script>\n/* ============================================================\n   内蔵シナリオ (1/3) プロローグ・レオ・ティエラ\n   ============================================================ */\nconst PROLOGUE={id:\"prologue\",scenes:[\n  {bg:\"port\",sp:\"n\",text:\"潮の香りと、焼きたてのパンのにおい。船を降りた{name}の目の前に、白壁とレンガ屋根の町並みが広がっていた。\"},\n  {bg:\"port\",sp:\"n\",text:\"――ここが冒険者の島・ファルダゴ。海の向こうに霞んで見えるのが、古代文明の眠る「遺跡島」だ。\"},\n  {bg:\"port\",sp:\"pl\",text:\"(よし……今日からここで新生活だ。まずは町を見て回ろうかな)\"},\n  {bg:\"town\",sp:\"n\",text:\"大通りに出ると、屋台の呼び込みや冒険者たちの笑い声で溢れていた。きょろきょろしながら歩いていると――\"},\n  {bg:\"town\",sp:\"wayne\",text:\"おっ、見ない顔だ。今日の船で着いた人? 荷物、重そうだね。持つよ!\"},\n  {bg:\"town\",sp:\"pl\",text:\"(え、距離が近い……!)えっと、ありがとう……?\"},\n  {bg:\"town\",sp:\"wayne\",text:\"俺はウェイン。遺跡管理局の職員やってるんだ。困ったことがあったら管理局においでよ。……あ、ほら、あそこにいるのが俺のダチ!\"},\n  {bg:\"town\",sp:\"leo\",text:\"ウェイン! お前また初対面の人の荷物勝手に持とうとしてんのか。……ん? あんた、新顔か。俺はレオ。魔導具のエンジニアだ。\"},\n  {bg:\"town\",sp:\"leo\",text:\"冒険で使う道具に困ったら俺の工房に来い。設計もデザインも俺がやってる。性能は保証するぜ、なんせ俺が作ってるからな!\"},\n  {bg:\"town\",sp:\"tiera\",text:\"ふふ、レオは会って十秒で自慢が始まるんだね。私はティエラ。装飾品のお店をやってるよ。あなた、名前は?\"},\n  {bg:\"town\",sp:\"pl\",text:\"{name}です。今日この島に越してきて……\",ch:[\n    {t:\"冒険者になりに来た、と言う\",fx:{flag:\"pl_adv\"},jump:11},\n    {t:\"のんびり暮らしに来た、と言う\",fx:{flag:\"pl_slow\"},jump:12}\n  ]},\n  {bg:\"town\",sp:\"romdo\",text:\"冒険者志望か。なら顔を覚えとくぜ。俺はロムド、ギルド連合本部で依頼の仲介をやってる。手続きで分からねえことがあったら本部に来な。\",jump:13},\n  {bg:\"town\",sp:\"romdo\",text:\"はっ、いいじゃねえか。この島は冒険しなくても飯がうまい。俺はロムド、ギルド連合本部の職員だ。島暮らしの相談なら乗ってやるよ。\"},\n  {bg:\"town\",sp:\"wayne\",text:\"ね、{name}。俺たち、夜はだいたい共用スペースでご飯食べてるんだ。今夜おいでよ、歓迎会ってことで! 料理は俺が作るよ。\"},\n  {bg:\"interior\",sp:\"n\",text:\"――その夜、19時ごろ。共用スペースの大きなテーブルには、湯気の立つ料理がずらりと並んだ。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"それじゃあ、{name}のファルダゴ上陸を祝って――\"},\n  {bg:\"interior\",sp:\"leo\",text:\"おう、やるか!\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"ほら、グラス持てグラス。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"せーの……\"},\n  {bg:\"interior\",sp:\"n\",text:\"「「「「乾杯!!」」」」\\n\\nこうして、{name}のファルダゴでの日々が始まった。\",fx:{aff:{leo:1,tiera:1,wayne:1,romdo:1},flag:\"prologue\"}}\n]};\n\n/* ---------- レオ イベントチェーン ---------- */\nconst EV_LEO=[\n{id:\"leo1\",loc:\"workshop\",once:true,prio:10,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"工房の扉を開けると、金属と油のにおい。作業台には部品や図面が山積みだ。\"},\n  {bg:\"interior\",sp:\"leo\",text:\"お、{name}か。ちょうどいいところに来た! これ見ろよ、新作の携行型ライト。魔力残量が一目で分かるメーターつき!\"},\n  {bg:\"interior\",sp:\"pl\",text:\"へえ……!\",ch:[\n    {t:\"「すごい、便利そう!」\",fx:{aff:{leo:2}},jump:3},\n    {t:\"「メーター、なんか曲がってない?」\",fx:{aff:{leo:1}},jump:4}\n  ]},\n  {bg:\"interior\",sp:\"leo\",text:\"だろ? すげーだろ! 冒険者ってのは夜の遺跡で明かりが切れるのが一番怖いんだ。だからこいつが要る。……ふっ、我ながら天才だな。\",jump:5},\n  {bg:\"interior\",sp:\"leo\",text:\"……あ? ……うおっ、ほんとだ。試作三号までは真っ直ぐだったのに! ちょっと待て、今直す。すぐ直す。天才だからすぐ直せる。\"},\n  {bg:\"interior\",sp:\"n\",text:\"レオは楽しそうに図面を広げて説明を始めた。話は一時間止まらなかった。\"}\n]},\n{id:\"leo2\",loc:\"workshop\",once:true,prio:10,cond:{aff:{leo:3}},scenes:[\n  {bg:\"interior\",sp:\"leo\",text:\"{name}! いいところに来た。この魔導コンパス、遺跡島の「気」の流れを読んで道を示すんだ。方位磁針じゃ遺跡島は狂うからな。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"気の流れを……? どういう仕組み?\"},\n  {bg:\"interior\",sp:\"leo\",text:\"聞きたいか? 聞きたいよな? よし、まず遺跡島の中心ほど「気」が濃いって話からだ――\"},\n  {bg:\"interior\",sp:\"n\",text:\"気づけば窓の外は夕焼け。レオの講義は白熱し、{name}のノートは謎の図でいっぱいになった。\"},\n  {bg:\"town_eve\",sp:\"leo\",text:\"……って、もうこんな時間か! わりぃ、俺、話し出すと止まらなくてさ。でもお前、最後まで聞いてくれたな。……いい耳してるよ、お前。\",fx:{aff:{leo:2},flag:\"leo_compass\"}}\n]},\n{id:\"leo3\",loc:\"workshop\",once:true,prio:10,cond:{aff:{leo:6}},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"工房の扉を叩いても返事がない。……嫌な予感がして中を覗くと、作業台に突っ伏したレオがいた。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"レオ!? 大丈夫!?\"},\n  {bg:\"interior\",sp:\"leo\",text:\"……ん、ああ……{name}か……。今何日だ? 納期のオーダー品に集中してたら、その、あれだ。飯……いつ食ったかな……。\"},\n  {bg:\"interior\",sp:\"n\",text:\"また寝食を忘れて没頭していたらしい。\",ch:[\n    {t:\"食堂からご飯を買ってくる(-100G)\",req:{money:100},fx:{money:-100,aff:{leo:3},flag:\"leo_meshi\"},jump:4},\n    {t:\"とにかく寝かせる\",fx:{aff:{leo:2}},jump:5}\n  ]},\n  {bg:\"interior\",sp:\"leo\",text:\"――うめえ……! 五臓六腑に染みる……! わりぃな、{name}。俺、集中すると周りが見えなくなるんだ。……お前がいてくれて助かった。\",jump:6},\n  {bg:\"interior\",sp:\"leo\",text:\"い、いや、あとちょっとで区切りが……すぴー……。\\n\\n……{name}は毛布をかけて、そっと工房を出た。\",jump:6},\n  {bg:\"town_eve\",sp:\"n\",text:\"後日、レオのオーダー品は無事に納品されたらしい。依頼主は大満足だったとか。\"}\n]},\n{id:\"leo4\",loc:\"workshop\",once:true,prio:10,cond:{aff:{leo:10}},scenes:[\n  {bg:\"interior\",sp:\"leo\",text:\"{name}、頼みがある! 新作の試作機、フィールドテストに付き合ってくれ。遺跡島で実際に動かしたいんだ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"遺跡島で? レオも行くの?\"},\n  {bg:\"interior\",sp:\"leo\",text:\"お、俺は……その、非戦闘員だからな? ウェインかロムドが一緒じゃないと入れねえの。だから今度みんなで行くときに、な? な?\"},\n  {bg:\"interior\",sp:\"n\",text:\"自信家のレオが、少しだけ早口になった。魔獣はちょっと怖いらしい。\"},\n  {bg:\"interior\",sp:\"leo\",text:\"べつに怖いとかじゃねえぞ! 効率の問題だ、効率の! ……とにかく、こいつはお前に預けとく。使ってみて感想聞かせてくれよな。\",fx:{item:\"compass\",aff:{leo:2},flag:\"leo_test\"}}\n]},\n{id:\"leo5\",loc:\"workshop\",once:true,prio:10,cond:{aff:{leo:14},time:2},scenes:[\n  {bg:\"town_night\",sp:\"n\",text:\"夜の工房。今日は珍しく、レオは作業台ではなく窓辺に座って海を見ていた。\"},\n  {bg:\"town_night\",sp:\"leo\",text:\"よう。……なあ{name}、俺がなんで魔導具作ってるか、話したことあったか?\"},\n  {bg:\"town_night\",sp:\"leo\",text:\"俺はこの島育ちでさ。ガキの頃から、遺跡島帰りの冒険者の道具を見るのが好きだった。ボロボロになった道具って、そいつが生き延びた証拠なんだよ。\"},\n  {bg:\"town_night\",sp:\"leo\",text:\"だから俺の道具で、一人でも多く無事に帰ってきてほしいんだ。……ウェインのギルドのことがあってからは、余計にな。\"},\n  {bg:\"town_night\",sp:\"pl\",text:\"……レオ。\",ch:[\n    {t:\"「レオの道具は、みんなを守ってるよ」\",fx:{aff:{leo:3}},jump:5},\n    {t:\"「その話、もっと聞かせて」\",fx:{aff:{leo:3}},jump:5}\n  ]},\n  {bg:\"town_night\",sp:\"leo\",text:\"……へへ。ま、俺は天才だからな! 俺の道具を持ってりゃ百人力ってことよ。……ありがとな、{name}。\",fx:{flag:\"leo_max\"}}\n]},\n/* レオ 汎用(買い物・贈り物) */\n{id:\"leo_shop\",loc:\"workshop\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"leo\",text:\"お、{name}。何か用か? 道具の相談なら任せろ。\",ch:[\n    {t:\"魔導コンパスを買う(500G/判定+15)\",req:{money:500},fx:{money:-500,item:\"compass\",aff:{leo:1}},jump:1},\n    {t:\"古代の歯車を見せる\",req:{item:\"relic\"},fx:{loseItem:\"relic\",aff:{leo:3}},jump:2},\n    {t:\"雑談する\",fx:{aff:{leo:1}},jump:3},\n    {t:\"帰る\",jump:4}\n  ]},\n  {bg:\"interior\",sp:\"leo\",text:\"まいどあり! そいつは遺跡島の「気」を読んで道を示す優れモンだ。なんせ俺が作ったからな、すげーだろ!\",jump:4},\n  {bg:\"interior\",sp:\"leo\",text:\"うおおおお!? 古代の歯車じゃねえか! この歯の切り方、現代の工房じゃ再現できねえんだよ……! くれるのか!? お前まじで最高だな!!\",jump:4},\n  {bg:\"interior\",sp:\"leo\",text:\"最近な、ティエラの店の陳列棚に回転機構つけたんだ。売り物がゆっくり回るの。あいつ「お客さんが酔いそう」って速度半分にされたけど。俺は傑作だと思うんだよなー。\",jump:4},\n  {bg:\"interior\",sp:\"n\",text:\"工房を後にした。\"}\n]}\n];\n\n/* ---------- ティエラ イベントチェーン ---------- */\nconst EV_TIERA=[\n{id:\"tiera1\",loc:\"shop\",once:true,prio:10,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"装飾品店の店内は、色とりどりの石やアクセサリーがきらきらと光っている。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"いらっしゃい……あ、{name}だ。来てくれて嬉しいな。ゆっくり見ていってね。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"きれいなお店だね。ティエラが一人でやってるの?\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"うん。ここ、おばあちゃんのお店なんだ。おばあちゃんが倒れちゃって、代わりに私が島に来たの。まだ慣れないことも多いけどね。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"あ、でも心配しないで。私、こう見えて結構たくましいんだよ? 昨日も酔っぱらいの冒険者さんを三人、笑顔で追い返したし。\",fx:{aff:{tiera:2}}}\n]},\n{id:\"tiera2\",loc:\"shop\",once:true,prio:10,cond:{aff:{tiera:3}},scenes:[\n  {bg:\"interior\",sp:\"tiera\",text:\"あ、{name}、いいところに! ちょっとお願いがあるんだけど……今日、仕入れの荷物が一気に届いちゃって。手伝ってくれたら、お礼するよ。\"},\n  {bg:\"interior\",sp:\"n\",text:\"二人で木箱を運び、石を種類ごとに棚へ並べていく。ティエラは石を一つずつ手に取り、産地と意味をすらすらと説明してくれた。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"詳しいんだね……!\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"ふふ、おばあちゃんの手紙で毎週勉強してるんだ。石にはね、それぞれ物語があるんだよ。それをお客さんに渡すのが、この店の仕事なの。\"},\n  {bg:\"town_eve\",sp:\"tiera\",text:\"はい、今日のお礼! お給料と、あとこれ、売り物にならない欠けた石だけど……{name}の目の色に似てて、きれいだったから。\",fx:{money:200,aff:{tiera:2}}}\n]},\n{id:\"tiera3\",loc:\"shop\",once:true,prio:10,cond:{aff:{tiera:6}},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"店先で、ティエラが手紙を読んでいた。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"あ、{name}。おばあちゃんから手紙が来たんだ。リハビリ、順調なんだって。「店のことは任せた、あんたは島の暮らしを楽しみなさい」……だって。おばあちゃんらしいよね。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"よかったね。……寂しくない? 知らない島に一人で来て。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"うーん……最初の夜はちょっとだけ泣いたよ? でもね、次の日にはウェインがご飯に誘ってくれて、レオが店の看板を直してくれて、ロムドが「困ったら本部に来い」って。\",ch:[\n    {t:\"「いい仲間だね」\",fx:{aff:{tiera:3}},jump:4},\n    {t:\"「ティエラが頑張ってるからだよ」\",fx:{aff:{tiera:3}},jump:4}\n  ]},\n  {bg:\"interior\",sp:\"tiera\",text:\"……ふふ、そうだね。だから今はね、この島に来てよかったって思ってるよ。{name}にも会えたしね。\"}\n]},\n{id:\"tiera4\",loc:\"shop\",once:true,prio:10,cond:{aff:{tiera:10}},scenes:[\n  {bg:\"interior\",sp:\"tiera\",text:\"ねえ{name}、「星詠み草」って知ってる? 遺跡島にだけ咲く花で、乾かすと星みたいに光るんだって。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"それを使った髪飾りが、おばあちゃんの代の看板商品だったの。私、それを復活させたいんだ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"でも遺跡島って、魔獣が……\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"うん、私は戦えないから、ウェインかロムドと一緒じゃないと入れないの。もし{name}が遺跡島に行くことがあったら、探してみてくれない? 無理はしないでね。\",fx:{flag:\"tiera_quest\",aff:{tiera:2}}}\n]},\n{id:\"tiera4b\",loc:\"shop\",once:true,prio:11,cond:{flag:\"tiera_quest\",aff:{tiera:10}},scenes:[\n  {bg:\"interior\",sp:\"pl\",text:\"ティエラ、これ……!\",ch:[\n    {t:\"星詠み草を渡す\",req:{item:\"flower\"},fx:{loseItem:\"flower\",aff:{tiera:4},flag:\"tiera_flower\"},jump:1},\n    {t:\"(まだ持っていない……)\",jump:2}\n  ]},\n  {bg:\"interior\",sp:\"tiera\",text:\"これ……星詠み草!? ほんとに見つけてきてくれたの!? ありがとう……! 見て、ほら、光ってる……。おばあちゃんに手紙で自慢しなきゃ。{name}、あなたは私の恩人だよ!\",jump:3},\n  {bg:\"interior\",sp:\"tiera\",text:\"……あ、ごめんね、勘違い。星詠み草はまだなんだね。焦らなくていいからね。\",jump:3},\n  {bg:\"interior\",sp:\"n\",text:\"店を後にした。\"}\n]},\n{id:\"tiera5\",loc:\"shop\",once:true,prio:10,cond:{flag:\"tiera_flower\",aff:{tiera:14}},scenes:[\n  {bg:\"town_eve\",sp:\"n\",text:\"夕暮れの店先で、ティエラが小さな箱を差し出した。\"},\n  {bg:\"town_eve\",sp:\"tiera\",text:\"復活第一号の星詠み草の髪飾り……を作る前にね、試作品を作ったの。はい、これ、{name}の分。\"},\n  {bg:\"town_eve\",sp:\"pl\",text:\"えっ、いいの!? 看板商品の……\"},\n  {bg:\"town_eve\",sp:\"tiera\",text:\"{name}が摘んできてくれた草だもん。最初の一つは{name}のだよ。……つけてみて。うん、似合う似合う! ふふ、私、この島に来て一番いい仕事したかも。\",fx:{aff:{tiera:3},flag:\"tiera_max\",item:\"charm\"}}\n]},\n/* ティエラ 汎用(買い物・贈り物) */\n{id:\"tiera_shop\",loc:\"shop\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"tiera\",text:\"いらっしゃい、{name}。今日はどうする?\",ch:[\n    {t:\"幸運のお守りを買う(300G/判定+10)\",req:{money:300},fx:{money:-300,item:\"charm\",aff:{tiera:1}},jump:1},\n    {t:\"星詠み草を見せる\",req:{item:\"flower\"},fx:{},jump:2},\n    {t:\"雑談する\",fx:{aff:{tiera:1}},jump:3},\n    {t:\"帰る\",jump:4}\n  ]},\n  {bg:\"interior\",sp:\"tiera\",text:\"ありがとう! それね、遺跡島帰りの冒険者さんに一番人気なんだよ。効果? ……ふふ、信じる心が大事なの。\",jump:4},\n  {bg:\"interior\",sp:\"tiera\",text:\"わ、星詠み草だ……! それ、大事に持っててね。しかるべき時に、しかるべきお願いをするかも。ふふ。\",jump:4},\n  {bg:\"interior\",sp:\"tiera\",text:\"昨日ね、レオが店の棚に回転機構をつけてくれたんだけど、速すぎてブローチが一個飛んでいったの。速度は半分にしてもらったよ。レオってば「回転数は浪漫だ」って不満そうだったけど。\",jump:4},\n  {bg:\"interior\",sp:\"n\",text:\"店を後にした。\"}\n]}\n];\n<\u002Fscript>\n<script>\n/* ============================================================\n   内蔵シナリオ (2/3) ウェイン・ロムド・食堂・共用スペース\n   ============================================================ */\nconst EV_WAYNE=[\n{id:\"wayne1\",loc:\"bureau\",once:true,prio:10,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"苔緑の壁の遺跡管理局。カウンターの奥で、ウェインが書類の山と格闘していた。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"あ、{name}! いらっしゃい。ここが俺の職場、遺跡管理局だよ。遺跡島の巡回とか、調査申請の受付とか、装備チェックとか……あと書類! 書類がとにかく多い!\"},\n  {bg:\"interior\",sp:\"hao\",text:\"先輩、その書類、昨日が締切のぶんです……。あ、こんにちは。僕はハオシェン、先輩の後輩です。いつも先輩がお世話になっています。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"ハオシェンは優秀なんだよ。俺の書類の締切を全部覚えてる。……で、{name}、せっかく来たなら手続きしていきなよ。遺跡島の同行渡航の登録。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"一般の人は、俺たち管理局の人間か、ライセンス持ちの冒険者と一緒じゃないと遺跡島に入れないんだ。登録しておけば、俺かロムドと一緒に渡れるようになるよ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"(書類に名前を書いた。これで同行者がいれば遺跡島に行けるらしい)\",fx:{item:\"ticket\",flag:\"ticket\",aff:{wayne:2}}},\n  {bg:\"interior\",sp:\"wayne\",text:\"はい、受理! 行くときは港においで。俺は護衛の仕事でしょっちゅう渡ってるからさ。……ふふ、遺跡島、いいところだよ。ちょっと危ないけど、それ以上にすごい場所だ。\"}\n]},\n{id:\"wayne2\",loc:\"bureau\",once:true,prio:10,cond:{aff:{wayne:3}},scenes:[\n  {bg:\"interior\",sp:\"wayne\",text:\"{name}、ナイスタイミング! いまから昼休憩なんだ。ちょっと付き合ってよ、武具屋に新しい剣が入ったんだって!\"},\n  {bg:\"town\",sp:\"n\",text:\"ウェインは剣を眺めながら、子どもみたいに目を輝かせている。\"},\n  {bg:\"town\",sp:\"wayne\",text:\"見てよこの反り! この重心! ……あ、引いてる? 俺、趣味が「新しい剣を買うこと」なんだ。買ったら遺跡島で試し斬りするの。それがもう、最高でさ。\"},\n  {bg:\"town\",sp:\"pl\",text:\"……\",ch:[\n    {t:\"「どれが一番いいの?」と聞く\",fx:{aff:{wayne:2}},jump:4},\n    {t:\"「元冒険者なんだっけ?」と聞く\",fx:{aff:{wayne:2}},jump:5}\n  ]},\n  {bg:\"town\",sp:\"wayne\",text:\"聞いてくれる!? えっとね、切れ味ならこっち、でも取り回しならこっち……ああでも今月の給料がさ……。よし決めた、両方買う! 来月の俺、ごめん!\",jump:6},\n  {bg:\"town\",sp:\"wayne\",text:\"ん? うん、昔はギルド組んで遺跡島に潜ってたよ。いろいろあって、いまは管理局側。でも剣は好きなまんまなんだよね。……ま、その話はまた今度!\",jump:6},\n  {bg:\"town_eve\",sp:\"n\",text:\"結局ウェインは剣を抱えてほくほくと帰っていった。給料日前だというのに。\"}\n]},\n{id:\"wayne3\",loc:\"bureau\",once:true,prio:10,cond:{aff:{wayne:6}},scenes:[\n  {bg:\"interior\",sp:\"hao\",text:\"あっ、{name}さん! ちょうどよかった、先輩を見ませんでしたか? 巡回報告の時間なのにいないんです……。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"一緒に探そうか。……えっと、ウェインの行きそうな場所……\",ch:[\n    {t:\"食堂を見に行く\",jump:2},\n    {t:\"港を見に行く\",jump:3}\n  ]},\n  {bg:\"interior\",sp:\"wayne\",text:\"――いた。食堂の厨房で、実家の鍋を借りて何かを煮込んでいた。\\n\\n「あ、{name}にハオシェン! ごめんごめん、煮込みが佳境で。巡回中に仕留め……じゃなくて、手に入った肉があってさ」\",jump:4},\n  {bg:\"port\",sp:\"n\",text:\"港には桟橋の釣り人だけ。ハオシェンが「あっ、先輩は多分あそこです。食堂です。いいにおいがするとだいたいいます」と言った。\\n\\n――果たしてウェインは食堂の厨房にいた。\",jump:4},\n  {bg:\"interior\",sp:\"hao\",text:\"先輩!! 報告書!! ……もう、僕が代わりに下書きしておきましたから、味見させてください。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"ハオシェンは本当にいい後輩だよ。はい、{name}も味見。……ね、うまいでしょ? 何の肉かは聞かないのが作法だよ。\",fx:{aff:{wayne:2}}}\n]},\n{id:\"wayne4\",loc:\"bureau\",once:true,prio:10,cond:{aff:{wayne:10}},scenes:[\n  {bg:\"interior\",sp:\"wayne\",text:\"{name}、明日って暇? 護衛の仕事で遺跡島の冒険者キャンプまで行くんだけど、荷物持ちの手が足りなくてさ。日当出るよ!\"},\n  {bg:\"ruins\",sp:\"n\",text:\"――翌日、遺跡島。霧の流れる石畳を、ウェインは鼻歌まじりに歩く。魔獣の遠吠えが聞こえても、足取りはまったく変わらない。\"},\n  {bg:\"ruins\",sp:\"wayne\",text:\"キャンプの人たち、何週間もここで生活してるからさ。届け物ひとつでめちゃくちゃ喜んでくれるんだよ。ほら、着いた。……おーい! 管理局でーす!\"},\n  {bg:\"ruins\",sp:\"n\",text:\"キャンプの冒険者たちがウェインを見て手を振る。ずいぶん慕われているようだ。帰り道、ウェインは上機嫌で新しい剣の素振りをしていた。\",fx:{money:300,aff:{wayne:2},flag:\"wayne_camp\"}}\n]},\n{id:\"wayne5\",loc:\"bureau\",once:true,prio:10,cond:{aff:{wayne:14},time:2},scenes:[\n  {bg:\"town_night\",sp:\"n\",text:\"夜の管理局。当直らしいウェインが、窓際で海を――遺跡島の方角を見ていた。\"},\n  {bg:\"town_night\",sp:\"wayne\",text:\"……あ、{name}。こんな時間にどうしたの。……ん、俺? 当直だよ。夜はさ、たまに思い出すんだよね。昔の仲間のこと。\"},\n  {bg:\"town_night\",sp:\"wayne\",text:\"俺、昔はギルドを組んで遺跡島の奥を目指してたんだ。でも「魔龍」って魔獣に襲われて……俺以外、帰ってこられなかった。\"},\n  {bg:\"town_night\",sp:\"wayne\",text:\"それで冒険者はやめた。いまは管理局で、冒険者を支える側。……後悔はしてないよ。誰かが無事に帰ってくるたび、ちょっとだけ救われるんだ。\"},\n  {bg:\"town_night\",sp:\"pl\",text:\"……ウェイン。\",ch:[\n    {t:\"黙って隣に立つ\",fx:{aff:{wayne:3}},jump:5},\n    {t:\"「話してくれてありがとう」\",fx:{aff:{wayne:3}},jump:5}\n  ]},\n  {bg:\"town_night\",sp:\"wayne\",text:\"……ふふ。しんみりさせちゃったね、ごめんごめん! よし、当直明けたら食堂で朝ごはん作るよ。{name}も食べていきなよ。とびきりうまいやつ!\",fx:{flag:\"wayne_max\"}}\n]},\n/* ウェイン 汎用 */\n{id:\"wayne_shop\",loc:\"bureau\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"wayne\",text:\"お、{name}。管理局に何か用? それとも俺に会いに来た? 嬉しいなあ。\",ch:[\n    {t:\"雑談する\",fx:{aff:{wayne:1}},jump:1},\n    {t:\"謎の魔獣肉を渡す\",req:{item:\"meat\"},fx:{loseItem:\"meat\",aff:{wayne:3}},jump:2},\n    {t:\"帰る\",jump:3}\n  ]},\n  {bg:\"interior\",sp:\"wayne\",text:\"最近ね、ハオシェンが装備チェックの新記録を出したんだよ。一日43件! 俺? 俺は書類の未処理の新記録を…………この話やめよっか。\",jump:3},\n  {bg:\"interior\",sp:\"wayne\",text:\"えっ、魔獣肉!? いいの!? やった、今夜の煮込みが決まった! ……どこ産の何の肉かって? ふふ、それは聞かないのが作法だよ。\",jump:3},\n  {bg:\"interior\",sp:\"n\",text:\"管理局を後にした。\"}\n]}\n];\n\n/* ---------- ロムド イベントチェーン ---------- */\nconst EV_ROMDO=[\n{id:\"romdo1\",loc:\"guild\",once:true,prio:10,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"ギルド連合本部。掲示板には依頼書がびっしり貼られ、冒険者たちが行き交う。奥のカウンターにロムドがいた。屋内なので、頭の布は外している。\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"よう、{name}。来たか。ここがギルド連合本部だ。依頼の仲介、報酬の査定、調査隊の編成……冒険者相手の何でも屋みてえなもんだな。\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"お前、仕事はどうすんだ? 決まってねえなら、ここの手伝いに来い。受付の補助くらいなら素人でもできる。日当も出す。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"いいの?\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"新入りの面倒見るのは俺の仕事のうちだ。……ってのは建前で、まあ、単に人手が足りねえ。ハハッ。困ったらいつでも来な。\",fx:{aff:{romdo:2},flag:\"romdo_work\"}}\n]},\n{id:\"romdo2\",loc:\"guild\",once:true,prio:10,cond:{aff:{romdo:3}},scenes:[\n  {bg:\"interior\",sp:\"romdo\",text:\"お、{name}。ちょうどいい、今日は依頼が多くてな。受付の列を捌くの手伝ってくれ。\"},\n  {bg:\"interior\",sp:\"n\",text:\"依頼書を仕分け、冒険者の質問を取り次ぎ、気づけば夕方。カウンターの奥から、眼鏡の女性職員が書類を持ってきた。\"},\n  {bg:\"interior\",sp:\"ninon\",text:\"ロムドさん、本日の査定分、まとめておきました。……あら、新しい方? 私はニノン、ここの事務です。ふふ、ロムドさんにこき使われていませんか?\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"おい、人聞きの悪いこと言うんじゃねえよ。……{name}、こいつはニノン。俺の同僚で、ティエラの友達でもある。書類仕事はこいつが一番速え。\"},\n  {bg:\"town_eve\",sp:\"romdo\",text:\"今日は助かった。ほら、日当。……お前、筋がいいな。受付の姉ちゃんたちが褒めてたぜ。また来な。\",fx:{money:250,aff:{romdo:2}}}\n]},\n{id:\"romdo3\",loc:\"guild\",once:true,prio:10,cond:{aff:{romdo:6}},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"閉店間際の本部。ロムドが若い冒険者の相談に乗っていた。装備の選び方から宿の場所まで、ずいぶん丁寧だ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"(……面倒見がいいんだな)\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"あん? 見てたのか。……ガキの頃から、なんか頼られる性分でな。気づいたら顔ばっかり広くなった。この島の連中の顔と名前、だいたい言えるぜ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"それってすごいことじゃない?\",ch:[\n    {t:\"「ロムドがいると安心する」\",fx:{aff:{romdo:3}},jump:4},\n    {t:\"「私の顔も覚えてる?」と聞く\",fx:{aff:{romdo:3}},jump:5}\n  ]},\n  {bg:\"interior\",sp:\"romdo\",text:\"……はっ、なんだよ急に。照れるだろうが。……ま、困ったやつを放っておけねえだけだ。お前も困ったら来い。何度でも言うぞ。\",jump:6},\n  {bg:\"interior\",sp:\"romdo\",text:\"当たり前だろ。{name}、来た日の船、着てた服、最初に食った飯まで言えるぞ。……なんだその顔。仲間のことは忘れねえんだよ、俺は。\",jump:6},\n  {bg:\"town_night\",sp:\"n\",text:\"外に出るとき、ロムドは慣れた手つきで頭に布を巻き直した。\"}\n]},\n{id:\"romdo4\",loc:\"guild\",once:true,prio:10,cond:{aff:{romdo:10}},scenes:[\n  {bg:\"interior\",sp:\"romdo\",text:\"{name}、明日ちょっと付き合え。遺跡島の冒険者キャンプに物資が届いてるか、確認しに行く。ついでに建設中の詰所も見てくる。\"},\n  {bg:\"ruins\",sp:\"n\",text:\"――遺跡島。ロムドはキャンプの冒険者一人ひとりに声をかけ、物資の帳簿をつけていく。\"},\n  {bg:\"ruins\",sp:\"romdo\",text:\"物資の供給はギルド連合の仕事だ。ここの連中は何週間もキャンプで生活してるからな、塩ひとつ切れても士気に関わる。\"},\n  {bg:\"ruins\",sp:\"romdo\",text:\"あっちで建ててるのが新しい詰所だ。建築ギルドは仕事が早えな……もう骨組みができてやがる。\"},\n  {bg:\"ruins\",sp:\"n\",text:\"帰りの船で、ロムドは「今日の礼だ」と日当をくれた。\",fx:{money:300,aff:{romdo:2},flag:\"romdo_camp\"}}\n]},\n{id:\"romdo5\",loc:\"guild\",once:true,prio:10,cond:{aff:{romdo:14},time:2},scenes:[\n  {bg:\"town_night\",sp:\"n\",text:\"夜、本部の裏口でロムドが一人、星を見ていた。\"},\n  {bg:\"town_night\",sp:\"romdo\",text:\"よう。……なんだ、お前も眠れねえクチか。座れよ。\"},\n  {bg:\"town_night\",sp:\"romdo\",text:\"……なあ、{name}。お前がこの島に来て、そこそこ経つな。どうだ、ここは。\"},\n  {bg:\"town_night\",sp:\"pl\",text:\"……\",ch:[\n    {t:\"「来てよかったって思ってる」\",fx:{aff:{romdo:3}},jump:4},\n    {t:\"「ロムドたちがいるから楽しい」\",fx:{aff:{romdo:3}},jump:4}\n  ]},\n  {bg:\"town_night\",sp:\"romdo\",text:\"……そうか。なら、いい。\\n\\n俺はな、この島の「ただいま」と「おかえり」の数を増やすのが仕事だと思ってる。冒険者が帰ってくる。飯がある。仲間がいる。それでいい島なんだ、ここは。\"},\n  {bg:\"town_night\",sp:\"romdo\",text:\"お前の「おかえり」も、もう俺たちの数のうちだ。……よし、湿っぽい話は終わりだ! 明日も来いよ。仕事は山ほどあるからな!\",fx:{flag:\"romdo_max\"}}\n]},\n/* ロムド 汎用(素材売却) */\n{id:\"romdo_shop\",loc:\"guild\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"romdo\",text:\"お、{name}。どうした、仕事か? 素材の買い取りなら査定してやるぞ。\",ch:[\n    {t:\"赤の遺輝石を売る(+300G)\",req:{item:\"gem_r\"},fx:{loseItem:\"gem_r\",money:300},jump:1},\n    {t:\"蒼の遺輝石を売る(+500G)\",req:{item:\"gem_b\"},fx:{loseItem:\"gem_b\",money:500},jump:1},\n    {t:\"古代金貨を見せる\",req:{item:\"oldcoin\"},fx:{loseItem:\"oldcoin\",aff:{romdo:3}},jump:2},\n    {t:\"雑談する\",fx:{aff:{romdo:1}},jump:3},\n    {t:\"帰る\",jump:4}\n  ]},\n  {bg:\"interior\",sp:\"romdo\",text:\"ほう、状態がいいな。査定額はこんなもんだ。まいど。……お前、いい拾い物するじゃねえか。\",jump:4},\n  {bg:\"interior\",sp:\"romdo\",text:\"……お、こいつは古い意匠だな。ちょっと見せてみろ。……ほーう、彫りが深え。いい仕事してやがる。え、くれんのか? ……悪いな。大事にするわ。\",jump:4},\n  {bg:\"interior\",sp:\"romdo\",text:\"最近な、レオのやつがうちの受付に「番号札の自動繰り上げ機」を売り込みに来た。便利そうだが、試作機が札を天井まで飛ばしたからな。導入は保留だ。\",jump:4},\n  {bg:\"interior\",sp:\"n\",text:\"本部を後にした。\"}\n]}\n];\n\n/* ---------- 食堂イベント ---------- */\nconst EV_DINER=[\n{id:\"diner1\",loc:\"diner\",once:true,prio:10,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"ウェインの実家の食堂。昼どきで、冒険者たちで賑わっている。看板メニューは煮込みらしい。\"},\n  {bg:\"interior\",sp:\"mob\",text:\"「ここの煮込みを食わずにファルダゴは語れねえよ」と、隣の席の冒険者が教えてくれた。\"},\n  {bg:\"interior\",sp:\"n\",text:\"注文した煮込みは、湯気からしてもう美味しい。スプーンが止まらなかった。\",fx:{money:-100}},\n  {bg:\"interior\",sp:\"n\",text:\"(お会計100G。これは通いたくなる味だ……)\"}\n]},\n{id:\"diner2\",loc:\"diner\",once:true,prio:10,cond:{aff:{wayne:5}},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"食堂に入ると、レオとティエラとロムドが同じテーブルにいた。厨房からウェインがひょっこり顔を出す。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"みんな揃ってる! ちょうどよかった、新作ができたんだ。「特製・魔獣スジ肉の煮込み」!\"},\n  {bg:\"interior\",sp:\"leo\",text:\"待てウェイン。その「魔獣」って部分、詳しく聞かせろ。何の肉だ。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"ふふ、それは聞かないのが作法だよ。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"ウェインのこれ、いつものことだよ。でもね、悔しいことに毎回おいしいの。\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"……先週の「謎の白身」も結局うまかったからな。よし、俺は食うぞ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"……!\",ch:[\n    {t:\"思い切って食べる\",fx:{aff:{wayne:2,leo:1}},jump:7},\n    {t:\"レオと一緒に正体を推理する\",fx:{aff:{leo:2,wayne:1}},jump:8}\n  ]},\n  {bg:\"interior\",sp:\"n\",text:\"――おいしい。腹立たしいほどおいしい。レオが「くそっ、うまい」と唸り、ティエラが笑い、ロムドがおかわりを頼んだ。正体は最後まで分からなかった。\",jump:9},\n  {bg:\"interior\",sp:\"leo\",text:\"「繊維の向きからして走る系の魔獣……いや、この弾力は飛ぶ系か?」――推理は白熱したが、結論が出る前に皿が空になった。うまかったからしかたない。\",jump:9},\n  {bg:\"interior\",sp:\"wayne\",text:\"お粗末さまでした! ふふ、みんなのその顔が見たくて料理してるんだよね、俺。\"}\n]},\n/* 食堂 汎用 */\n{id:\"diner_shop\",loc:\"diner\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"食堂はいい匂いに満ちている。どうしよう?\",ch:[\n    {t:\"煮込みを食べる(-100G)\",req:{money:100},fx:{money:-100},jump:1},\n    {t:\"弁当を買う(-200G/探索で失敗1回帳消し)\",req:{money:200},fx:{money:-200,item:\"bento\"},jump:2},\n    {t:\"帰る\",jump:3}\n  ]},\n  {bg:\"interior\",sp:\"n\",text:\"今日の煮込みも絶品だった。体の芯からあったまる。\",jump:3},\n  {bg:\"interior\",sp:\"wayne\",text:\"はい、弁当お待たせ! 遺跡島に行くならこれ持っていきなよ。腹が減ってると、人間いいことを思いつかないからね。\",jump:3},\n  {bg:\"interior\",sp:\"n\",text:\"食堂を後にした。\"}\n]}\n];\n\n/* ---------- 共用スペース・グループイベント ---------- */\nconst EV_GROUP=[\n{id:\"kanpai_ev\",loc:\"commons\",once:false,prio:3,cond:{flag:\"prologue\",time:2},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"夜の共用スペース。大きなテーブルに、今日もみんなが集まってきた。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"はいはい、今日のごはんできたよー! 全員グラス持った?\"},\n  {bg:\"interior\",sp:\"n\",text:\"「「「「乾杯!!」」」」\\n\\n今日も一日、おつかれさま。誰かの笑い話で、夜が更けていく。\",fx:{aff:{leo:1,tiera:1,wayne:1,romdo:1}}}\n]},\n{id:\"commons_leo\",loc:\"commons\",once:false,prio:2,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"共用スペースを覗くと、レオが図面を広げて唸っていた。\"},\n  {bg:\"interior\",sp:\"leo\",text:\"お、{name}か。ちょっと聞いてくれよ、この新型ランタンの設計、天才的じゃね? ……あ? 飯? ……そういや今日、食ったっけな……。\"},\n  {bg:\"interior\",sp:\"n\",text:\"危ないところだった。{name}はレオを食堂へ引きずっていった。\",fx:{aff:{leo:1}}}\n]},\n{id:\"commons_tiera\",loc:\"commons\",once:false,prio:2,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"共用スペースでは、ティエラとニノンがお茶を飲んでいた。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"あ、{name}もおいでよ。いまニノンと、屋台の串焼きはどこが一番かって話してたの。\"},\n  {bg:\"interior\",sp:\"ninon\",text:\"ティエラは広場の北の屋台派なんです。私は港の屋台派。{name}さんはどっち派ですか? これ、結構大事な話ですよ。\"},\n  {bg:\"interior\",sp:\"n\",text:\"結局、今度三人で食べ比べることになった。\",fx:{aff:{tiera:1}}}\n]},\n{id:\"group_hanami\",loc:\"commons\",once:true,prio:8,cond:{aff:{leo:6,tiera:6,wayne:6,romdo:6}},scenes:[\n  {bg:\"interior\",sp:\"wayne\",text:\"ねえねえ、聞いて。今度の休み、四人で遺跡島の外の原っぱにピクニック行こうって話してたんだ。{name}も一緒にどう?\"},\n  {bg:\"interior\",sp:\"leo\",text:\"俺の新作「保温バスケット」のテストも兼ねてるけどな! 弁当が冷めない画期的なやつ。すげーだろ。\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"私はレジャーシート担当。ロムドは?\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"俺は場所の手配と……まあ、全員分の引率だな。はぐれるなよ、お前ら。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"行く行く!\",fx:{flag:\"picnic_plan\",aff:{leo:1,tiera:1,wayne:1,romdo:1}}},\n  {bg:\"interior\",sp:\"n\",text:\"(次に港へ行けば、みんなでピクニックに出発できそうだ)\"}\n]},\n{id:\"group_picnic\",loc:\"port\",once:true,prio:12,cond:{flag:\"picnic_plan\"},scenes:[\n  {bg:\"port\",sp:\"n\",text:\"よく晴れた朝。桟橋にはすでに四人が揃っていた。ウェインの弁当箱が異様に大きい。\"},\n  {bg:\"ruins\",sp:\"n\",text:\"船で渡った先、遺跡島の外縁の原っぱ。霧もなく、風が気持ちいい。\"},\n  {bg:\"ruins\",sp:\"wayne\",text:\"はい、お弁当オープン! 今日のメインは唐揚げ!……何の肉かは、聞かないのが作法だよ。\"},\n  {bg:\"ruins\",sp:\"leo\",text:\"保温バスケットの温度、完璧だな。うますぎて秒で消えるぞこれ。……おいロムド、俺の唐揚げ取っただろ!\"},\n  {bg:\"ruins\",sp:\"romdo\",text:\"取ってねえよ。……取ったのはティエラだ。\"},\n  {bg:\"ruins\",sp:\"tiera\",text:\"ふふ、おいしいものは早い者勝ちだよ?\"},\n  {bg:\"ruins\",sp:\"n\",text:\"笑い声が原っぱに響く。帰りの船では、全員が船縁にもたれてうとうとしていた。いい休日だった。\",fx:{aff:{leo:2,tiera:2,wayne:2,romdo:2},unflag:\"picnic_plan\",flag:\"picnic_done\"}}\n]},\n{id:\"matsuri\",loc:\"plaza\",once:true,prio:8,cond:{day:5,time:2},scenes:[\n  {bg:\"town_night\",sp:\"n\",text:\"今夜の広場は祭りだ。屋台が並び、噴水の周りに人が集まっている。\"},\n  {bg:\"town_night\",sp:\"tiera\",text:\"{name}、こっちこっち! みんなで屋台まわるんだよ。\"},\n  {bg:\"town_night\",sp:\"leo\",text:\"射的の景品に魔導具のジャンク品があるぞ! 全部撃ち落として部品取りにする!\"},\n  {bg:\"town_night\",sp:\"romdo\",text:\"レオ、大人げねえからやめとけって。……お、串焼きだ。全員分買ってきてやるよ。\"},\n  {bg:\"town_night\",sp:\"wayne\",text:\"あ、ロムド、俺は二本! ……ね、{name}、あとで花火あがるんだよ。噴水のところが特等席なんだ。\"},\n  {bg:\"town_night\",sp:\"n\",text:\"夜空に大輪の花火。歓声。誰かのグラスがまた鳴った。――いい島に来たと、心から思う。\",fx:{aff:{leo:1,tiera:1,wayne:1,romdo:1},flag:\"matsuri_done\"}}\n]},\n{id:\"ending\",loc:\"commons\",once:true,prio:20,cond:{day:8,time:2,aff:{leo:12,tiera:12,wayne:12,romdo:12}},scenes:[\n  {bg:\"interior\",sp:\"n\",text:\"いつもの夜、いつもの共用スペース。でも今日は、テーブルの上がいつもより豪華だ。\"},\n  {bg:\"interior\",sp:\"wayne\",text:\"じゃーん! 今日は{name}がこの島に来て、はじめての「全員そろった特別な日」記念日! ってことで、ごちそう作りました!\"},\n  {bg:\"interior\",sp:\"leo\",text:\"俺からはこれ。魔導ランタンの{name}専用機。夜道も遺跡島もこれで安心だ。……俺の最高傑作だぞ、大事にしろよな!\"},\n  {bg:\"interior\",sp:\"tiera\",text:\"私からは、この島の石で作ったブレスレット。{name}がこの島の一員になった証だよ。\"},\n  {bg:\"interior\",sp:\"romdo\",text:\"俺からは……まあ、なんだ。「困ったらいつでも来い」の無期限延長券だ。一生もんだぞ、それ。\"},\n  {bg:\"interior\",sp:\"pl\",text:\"みんな……ありがとう。\",ch:[\n    {t:\"「私、この島に来てよかった!」\",jump:6},\n    {t:\"「これからもよろしくね」\",jump:6}\n  ]},\n  {bg:\"interior\",sp:\"n\",text:\"グラスが集まる。窓の外には星と、遠くに遺跡島の影。\\n\\n「「「「「乾杯!!」」」」」\\n\\n――{name}のファルダゴでの日々は、まだまだ続く。\",fx:{flag:\"ending_seen\"}}\n]}\n];\n\n/* ---------- 広場イベント ---------- */\nconst EV_PLAZA=[\n{id:\"hao_plaza\",loc:\"plaza\",once:true,prio:5,cond:{flag:\"ticket\"},scenes:[\n  {bg:\"town\",sp:\"hao\",text:\"あっ、{name}さん! 巡回のお知らせ配りです。今週、遺跡島の外縁で魔獣の目撃が増えているので、渡るときは気をつけてくださいね。\"},\n  {bg:\"town\",sp:\"hao\",text:\"先輩ですか? 先輩は今日も元気です。さっき「新しい剣を買ったから素振りしてくる」と言って屋上に……あっ、いえ、仕事はちゃんとしています! 本当です!\",fx:{aff:{wayne:1}}}\n]},\n{id:\"ninon_plaza\",loc:\"plaza\",once:true,prio:5,cond:{aff:{romdo:4}},scenes:[\n  {bg:\"town\",sp:\"ninon\",text:\"あら、{name}さん。お買い物ですか? 私はお昼休みの散歩です。\"},\n  {bg:\"town\",sp:\"ninon\",text:\"ロムドさん、最近{name}さんの話ばかりするんですよ。「あいつは筋がいい」って。ふふ、あの人、気に入った人のことはすーぐ自慢するんです。ティエラにも言っておかなきゃ。\",fx:{aff:{romdo:1,tiera:1}}}\n]},\n{id:\"plaza_mob1\",loc:\"plaza\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"town\",sp:\"mob\",text:\"広場の噴水のふちで、冒険者たちが遺跡島の自慢話をしていた。「中心部を見た」という話は、誰のものも少しずつ違う。まだ誰もたどり着いていないのだろう。\"}\n]},\n{id:\"plaza_mob2\",loc:\"plaza\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"town\",sp:\"mob\",text:\"商人が魔導具の露店を広げていた。「ファルダゴの魔導具は質がいいって、島の外じゃ有名なんだよ」と自慢げだ。レオが聞いたら鼻が高いだろう。\"}\n]},\n{id:\"plaza_mob3\",loc:\"plaza\",once:false,prio:1,cond:{flag:\"prologue\"},scenes:[\n  {bg:\"town\",sp:\"n\",text:\"広場のヤシの木の下で、猫が昼寝をしていた。隣に座って少しぼーっとする。……いい風だ。\"}\n]}\n];\n<\u002Fscript>\n<script>\n/* ============================================================\n   内蔵シナリオ (3/3) 遺跡島探索・フレーバー・各種画面\n   ============================================================ */\nconst EVENTS=[].concat(EV_LEO,EV_TIERA,EV_WAYNE,EV_ROMDO,EV_DINER,EV_GROUP,EV_PLAZA);\nlet CUSTOM_EVENTS=[];\n\n/* ---------- 汎用フレーバー ---------- */\nconst FLAVOR={\n  plaza:{bg:\"town\",texts:[\"広場は今日ものんびりした空気だ。噴水の水音が心地いい。\",\"露店のパン屋から、焼きたてのいいにおいがしてくる。\"]},\n  workshop:{bg:\"interior\",texts:[\"工房には灯りがついているが、レオは納品で出かけているようだ。\",\"作業台の上に「触るな。触ったな? 触っただろ」と書かれた張り紙がある。\"]},\n  shop:{bg:\"interior\",texts:[\"店先のガラス越しに、色とりどりの石がきらめいている。\",\"ティエラは接客中のようだ。楽しそうな笑い声が聞こえる。\"]},\n  diner:{bg:\"interior\",texts:[\"食堂は満席だ。煮込みの香りだけ嗅いで、また来ることにした。\"]},\n  bureau:{bg:\"interior\",texts:[\"管理局の掲示板に遺跡島の注意書きが増えていた。ハオシェンの字だろうか、とても丁寧だ。\"]},\n  guild:{bg:\"interior\",texts:[\"本部は冒険者でごった返している。ロムドの声が奥から響いてくる。「並べ並べ、順番だ!」\"]},\n  commons:{bg:\"interior\",texts:[\"共用スペースには誰もいなかった。テーブルを拭いて、少し座ってから出た。夜に来ればみんないるだろう。\"]},\n  port:{bg:\"port\",texts:[\"桟橋に座って海を眺めた。遠くに遺跡島の影がかすんで見える。\"]}\n};\n\n/* ---------- 港メニュー ---------- */\nfunction portMenu(){\n  const ev=nextEventFor(\"port\");\n  if(ev&&(ev.prio||0)>=5){runEvent(ev);return;}\n  const scenes=[{bg:\"port\",sp:\"n\",text:\"港。木の桟橋に、遺跡島行きの渡し船が停まっている。\",ch:[]}];\n  const ch=scenes[0].ch;\n  if(!S.flags.ticket){\n    ch.push({t:\"遺跡島に行ってみたい……\",jump:1});\n    scenes.push({bg:\"port\",sp:\"mob\",text:\"船頭が首を振った。「同行渡航の登録がまだだろ? 遺跡管理局で手続きしてきな。管理局の職員かライセンス持ちと一緒じゃないと渡せないんだ」\",jump:3});\n  }else{\n    if(S.time<2){\n      ch.push({t:\"ウェインと遺跡島へ渡る(丸一日)\",fx:{flag:\"_esc_wayne\"},jump:1});\n      ch.push({t:\"ロムドと遺跡島へ渡る(丸一日)\",fx:{flag:\"_esc_romdo\"},jump:1});\n    }else{\n      ch.push({t:\"(もう夜だ。遺跡島行きは朝か昼に)\",req:{flag:\"_never\"},jump:0});\n    }\n    scenes.push({bg:\"port\",sp:\"n\",text:\"(同行者と合流して船に乗り込んだ)\",jump:99});\n  }\n  ch.push({t:\"海を眺める\",jump:2});\n  ch.push({t:\"帰る\",jump:3});\n  scenes.push({bg:\"port\",sp:\"n\",text:rnd(FLAVOR.port.texts)});\n  scenes.push({bg:\"port\",sp:\"n\",text:\"港を後にした。\"});\n  fade(()=>startScenes(scenes,()=>{\n    if(S.flags._esc_wayne){delete S.flags._esc_wayne;ruinsRun(\"wayne\");return;}\n    if(S.flags._esc_romdo){delete S.flags._esc_romdo;ruinsRun(\"romdo\");return;}\n    gotoMap();\n  }));\n}\n\n/* ---------- 遺跡島探索 ---------- */\nconst ENC=[\n {name:\"淡く光る石の鉱脈\",\n  n:\"崩れた石柱の陰に、淡く光る石の鉱脈を見つけた。\",\n  w:\"お、遺輝石の鉱脈だ! 掘ってく? 俺、見張りしてるよ。\",\n  r:\"遺輝石だな。市場価値は俺が保証する。掘るなら手早くな。\",\n  diff:40, ok:{text:\"石はきれいに割れて、光る欠片が手に入った!\",fx:{item:\"gem_r\"}},\n  ng:{text:\"石は途中で砕けてしまった。欠片は光を失っている……残念。\"}},\n {name:\"青く光る鉱脈\",\n  n:\"霧の奥、ひときわ強く光る青い鉱脈があった。「気」が濃く、指先がぴりぴりする。\",\n  w:\"蒼の遺輝石だ……! 珍しいよ。でもこの辺は「気」が強いから、慎重にね。\",\n  r:\"おい、あれは上物だぞ。落ち着いて掘れよ。焦ったやつから失敗する。\",\n  diff:65, ok:{text:\"見事な蒼の遺輝石が採れた! 深い海みたいな色だ。\",fx:{item:\"gem_b\"}},\n  ng:{text:\"手が滑って鉱脈ごと崩れてしまった。惜しかった……。\"}},\n {name:\"古い魔導具の破片\",\n  n:\"苔の下に、古い魔導具の破片が埋まっていた。精巧な歯車が見える。\",\n  w:\"古代の魔導具だ! レオが見たら鼻息すごそうだね。\",\n  r:\"ほう、古代の部品か。レオのやつ、こういうのに目がねえんだよな。\",\n  diff:35, ok:{text:\"壊さないよう慎重に掘り出した。古代の歯車だ!\",fx:{item:\"relic\"}},\n  ng:{text:\"掘り出す途中で崩れてしまった。古代の技術は繊細だ……。\"}},\n {name:\"星詠み草の群生\",\n  n:\"岩陰に、小さな白い花が揺れている。……もしかして、これが星詠み草?\",\n  w:\"あっ、星詠み草! ティエラが探してたやつだよ。根を傷つけないようにね。\",\n  r:\"星詠み草か。ティエラの店の復活商品の材料だな。丁寧に摘めよ。\",\n  diff:45, ok:{text:\"そっと一株摘み取った。花びらがほのかに光っている。\",fx:{item:\"flower\"}},\n  ng:{text:\"風が強く、花びらが散ってしまった。また今度探そう。\"}},\n {name:\"小型の魔獣\",\n  n:\"茂みから小型の魔獣が飛び出してきた!\",\n  w:\"下がって! ……なんてね、この大きさなら大丈夫。追い払うよ。それとも素材、取っていく?\",\n  r:\"おっと。……ビビるな、こいつは小物だ。どうする?\",\n  diff:55, ok:{text:\"同行者が鮮やかに魔獣をいなし、肉を分けてくれた。\",fx:{item:\"meat\"}},\n  ng:{text:\"魔獣は茂みの奥へ逃げていった。まあ、無事ならそれでいい。\"}},\n {name:\"古代金貨のきらめき\",\n  n:\"小川の底で、何かが金色に光った。\",\n  w:\"金貨だ! 古代のやつ! 冷たいから俺が取ろうか? ……いや、ここは{name}の見せ場かな。\",\n  r:\"古代金貨だな。流されねえうちに拾っちまえ。\",\n  diff:50, ok:{text:\"冷たい水に手を入れて、古代金貨を拾い上げた!\",fx:{item:\"oldcoin\"}},\n  ng:{text:\"あと少しのところで金貨は流れに消えた。……川は覚えた。次だ。\"}},\n {name:\"崩れかけた石橋\",\n  n:\"行く手に崩れかけた石橋。渡れば近道だが、少し危ない。\",\n  w:\"うーん、俺一人なら飛ぶけど……よし、俺が先に渡って確かめるよ。ゆっくりね。\",\n  r:\"待て、先に俺が体重かけて確かめる。……よし、一人ずつだ。\",\n  diff:30, ok:{text:\"慎重に渡りきった。近道の先に、誰かの忘れた小袋が落ちていた。\",fx:{money:150}},\n  ng:{text:\"橋が軋んだので引き返した。遠回りしたぶん、少し疲れた。\"}},\n {name:\"迷子の新米冒険者\",\n  n:\"泣きそうな顔の新米冒険者に出会った。キャンプへの帰り道が分からなくなったらしい。\",\n  w:\"はいはい、管理局です! 大丈夫、キャンプはこっちだよ。……ほんと、俺の後輩みたいだね、キミ。\",\n  r:\"……ったく、しょうがねえな。ほら、ついてこい。キャンプまで送ってやる。\",\n  diff:0, ok:{text:\"キャンプまで送り届けると、彼はお礼にと路銀を分けてくれた。いい冒険者になれるといい。\",fx:{money:100}},\n  ng:{text:\"\"}},\n {name:\"古代の壁画\",\n  n:\"岩壁に、古代文明の壁画が残っていた。星と、乾杯するような人々の絵。\",\n  w:\"へえ……古代の人も、乾杯してたのかもね。なんかいいね、こういうの。\",\n  r:\"……昔の連中も飲んでたのか。はっ、島の伝統ってわけだ。\",\n  diff:0, ok:{text:\"しばらく二人で壁画を眺めた。遺跡島の風が、静かに吹き抜けていった。\",fx:{}},\n  ng:{text:\"\"}}\n];\nconst ENC_RARE_DRAGON={once_flag:\"seen_dragon\",\n  n:\"――そのとき。遠くで、空気そのものが震えるような咆哮が聞こえた。\",\n  w:\"…………。{name}、今日はもう帰ろう。……大丈夫、あれはずっと奥だ。ここまでは来ない。\",\n  end:\"帰りの船で、ウェインはずっと遺跡島の方を見ていた。でも船を降りるときには、いつもの顔で「さ、飯にしよ!」と笑った。\"};\n\nfunction ruinsBonus(escort){\n  let b=escort===\"wayne\"?20:15;\n  if(S.items.charm)b+=10;\n  if(S.items.compass)b+=15;\n  return b;\n}\nfunction ruinsRun(escort){\n  const esc=CHARS[escort];\n  const bonus=ruinsBonus(escort);\n  let bentoLeft=S.items.bento||0;\n  const picks=[];\n  const pool=[...ENC];\n  // ティエラ依頼中は星詠み草の遭遇率アップ\n  if(S.flags.tiera_quest&&!S.flags.tiera_flower&&chance(.8)){picks.push(ENC[3]);pool.splice(3,1);}\n  while(picks.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);picks.push(pool.splice(i,1)[0]);}\n  const scenes=[\n    {bg:\"port\",sp:\"n\",text:\"船は霧の帯を抜け、遺跡島の桟橋に着いた。\"},\n    {bg:\"ruins\",sp:escort,text:escort===\"wayne\"\n      ?\"はい、到着! 俺から離れないでね。外縁部なら景色を楽しむ余裕もあるよ。……剣? もちろん持ってきた。新しいやつ!\"\n      :\"着いたぞ。いいか、俺から離れるな。ここは自己責任の世界だが、お前は俺が連れて帰る。\"},\n  ];\n  picks.forEach(enc=>{\n    scenes.push({bg:\"ruins\",sp:\"n\",text:enc.n});\n    scenes.push({bg:\"ruins\",sp:escort,text:enc[escort===\"wayne\"?\"w\":\"r\"]});\n    if(enc.diff>0){\n      const roll=Math.random()*100+bonus;\n      let success=roll>=enc.diff;\n      let revived=false;\n      if(!success&&bentoLeft>0){bentoLeft--;success=true;revived=true;}\n      if(success){\n        const sc={bg:\"ruins\",sp:\"n\",text:(revived?\"(一息ついて弁当を食べたら、頭が冴えた!)\\n\":\"\")+enc.ok.text,fx:Object.assign({},enc.ok.fx)};\n        if(revived)sc.fx.loseItem=\"bento\";\n        scenes.push(sc);\n      }else{\n        scenes.push({bg:\"ruins\",sp:\"n\",text:enc.ng.text});\n      }\n    }else{\n      scenes.push({bg:\"ruins\",sp:\"n\",text:enc.ok.text,fx:Object.assign({},enc.ok.fx)});\n    }\n  });\n  // レア: 魔龍の咆哮(ウェイン同行・好感度8以上・一度きり)\n  if(escort===\"wayne\"&&(S.aff.wayne||0)>=8&&!S.flags[ENC_RARE_DRAGON.once_flag]&&chance(.5)){\n    scenes.push({bg:\"ruins_deep\",sp:\"n\",text:ENC_RARE_DRAGON.n,fx:{flag:ENC_RARE_DRAGON.once_flag}});\n    scenes.push({bg:\"ruins_deep\",sp:\"wayne\",text:ENC_RARE_DRAGON.w});\n    scenes.push({bg:\"port_eve\",sp:\"n\",text:ENC_RARE_DRAGON.end,fx:{aff:{wayne:2}}});\n  }else{\n    scenes.push({bg:\"port_eve\",sp:\"n\",text:\"日が傾いてきた。帰りの船に乗り込む。\"});\n    scenes.push({bg:\"port_eve\",sp:escort,text:escort===\"wayne\"\n      ?\"おつかれさま! いい探索だったね。帰ったらみんなに自慢しよ。あ、夜ごはん、俺作るよ!\"\n      :\"よし、全員無事。上出来だ。……ほら、今日の分の同行料はいらねえよ。そのかわり夜の乾杯には付き合え。\"});\n  }\n  scenes.push({bg:\"town_night\",sp:\"n\",text:\"ファルダゴに戻る頃には、もう夜だった。\",fx:{aff:{[escort]:1}}});\n  fade(()=>startScenes(scenes,()=>{S.time=2;gotoMap();}));\n}\n\n/* ---------- なかま画面 ---------- */\nconst PROFILES={\n  leo:{role:\"魔導具エンジニア\",desc:\"魔導具の設計・デザイン担当。知識欲旺盛な自信家。没頭すると寝食を忘れがち。\"},\n  tiera:{role:\"装飾品店の店主\",desc:\"祖母の店を引き継ぐため島に来た。おっとり見えて肝が据わっている。好奇心旺盛。\"},\n  wayne:{role:\"遺跡管理局 職員\",desc:\"元冒険者。楽天的で陽気、料理上手。趣味は新しい剣を買うこと。実家は食堂。\"},\n  romdo:{role:\"ギルド連合本部 職員\",desc:\"依頼の仲介やクエスト管理を担当。顔が広く、言葉は粗いが面倒見がいい兄貴肌。\"}\n};\nfunction renderStatus(){\n  const g=$(\"status-grid\");g.innerHTML=\"\";\n  MAIN4.forEach(id=>{\n    const ch=CHARS[id],p=PROFILES[id],a=S.aff[id]||0;\n    const d=document.createElement(\"div\");d.className=\"stat-card\";\n    d.innerHTML=`<img src=\"${ASSETS[ch.img]}\"><div class=\"scb\">\n      <div class=\"scn\">${ch.name}<\u002Fdiv><div class=\"scr\">${p.role}<\u002Fdiv>\n      <div class=\"sch\">好感度 ${\"♥\".repeat(Math.min(10,Math.floor(a/2)))} <b>${a}<\u002Fb><\u002Fdiv>\n      <div class=\"scd\">${p.desc}<\u002Fdiv><\u002Fdiv>`;\n    g.appendChild(d);\n  });\n}\nfunction renderItems(){\n  const l=$(\"items-list\");l.innerHTML=\"\";\n  const keys=Object.keys(S.items).filter(k=>S.items[k]>0);\n  if(!keys.length){l.innerHTML='<div class=\"note\">まだ何も持っていない。<\u002Fdiv>';return;}\n  keys.forEach(k=>{\n    const it=ITEMS[k];if(!it)return;\n    const d=document.createElement(\"div\");d.className=\"itemrow\";\n    d.innerHTML=`<div><div class=\"inm\">${it.name} ×${S.items[k]}<\u002Fdiv><div class=\"idc\">${it.desc}<\u002Fdiv><\u002Fdiv>`;\n    l.appendChild(d);\n  });\n}\nfunction checkEnding(){/* エンディングはイベント(ending)として発火する */}\n<\u002Fscript>\n<script>\n/* ============================================================\n   AI連携(Claude/Gemini)・セーブ・設定・起動\n   localStorage キー接頭辞: fadv_\n   ============================================================ */\nconst LS={save:\"fadv_save\",settings:\"fadv_settings\",scenario:\"fadv_scenario\"};\nlet CFG={aiOn:false,provider:\"claude\",key:\"\",model:\"\",speed:28};\nconst DEFAULT_MODELS={claude:\"claude-sonnet-4-5\",gemini:\"gemini-2.5-flash\"};\n\n/* ---------- 設定 ---------- */\nfunction loadCfg(){\n  try{const c=JSON.parse(localStorage.getItem(LS.settings)||\"{}\");Object.assign(CFG,c);}catch(e){}\n  $(\"sel-aion\").value=CFG.aiOn?\"on\":\"off\";\n  $(\"sel-provider\").value=CFG.provider;\n  $(\"inp-apikey\").value=CFG.key;\n  $(\"inp-model\").value=CFG.model;\n  $(\"sel-speed\").value=String(CFG.speed);\n  NV.speed=CFG.speed;\n}\nfunction saveCfg(){\n  CFG.aiOn=$(\"sel-aion\").value===\"on\";\n  CFG.provider=$(\"sel-provider\").value;\n  CFG.key=$(\"inp-apikey\").value.trim();\n  CFG.model=$(\"inp-model\").value.trim();\n  CFG.speed=+$(\"sel-speed\").value;\n  NV.speed=CFG.speed;\n  try{localStorage.setItem(LS.settings,JSON.stringify(CFG));}catch(e){}\n}\n[\"sel-aion\",\"sel-provider\",\"inp-apikey\",\"inp-model\",\"sel-speed\"].forEach(id=>$(id).addEventListener(\"change\",saveCfg));\n\n/* ---------- AI呼び出し(12秒タイムアウト・失敗時フォールバック) ---------- */\nfunction modelName(){return CFG.model||DEFAULT_MODELS[CFG.provider];}\nasync function callAI(promptText){\n  const ctrl=new AbortController();\n  const timer=setTimeout(()=>ctrl.abort(),12000);\n  try{\n    let res,body;\n    if(CFG.provider===\"claude\"){\n      res=await fetch(\"https://api.anthropic.com/v1/messages\",{\n        method:\"POST\",signal:ctrl.signal,\n        headers:{\"content-type\":\"application/json\",\"x-api-key\":CFG.key,\n          \"anthropic-version\":\"2023-06-01\",\"anthropic-dangerous-direct-browser-access\":\"true\"},\n        body:JSON.stringify({model:modelName(),max_tokens:800,\n          messages:[{role:\"user\",content:promptText}]})\n      });\n      if(!res.ok)throw new Error(\"HTTP \"+res.status);\n      body=await res.json();\n      return (body.content||[]).map(c=>c.text||\"\").join(\"\");\n    }else{\n      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName()}:generateContent?key=${encodeURIComponent(CFG.key)}`,{\n        method:\"POST\",signal:ctrl.signal,\n        headers:{\"content-type\":\"application/json\"},\n        body:JSON.stringify({contents:[{parts:[{text:promptText}]}]})\n      });\n      if(!res.ok)throw new Error(\"HTTP \"+res.status);\n      body=await res.json();\n      return body.candidates?.[0]?.content?.parts?.map(p=>p.text||\"\").join(\"\")||\"\";\n    }\n  }finally{clearTimeout(timer);}\n}\n$(\"btn-api-test\").onclick=async()=>{\n  saveCfg();\n  const el=$(\"api-test-result\");\n  if(!CFG.key){el.textContent=\"APIキーを入力してください\";return;}\n  el.innerHTML='<span class=\"spin\"><\u002Fspan> 接続中…';\n  try{\n    const t=await callAI(\"「接続OK」とだけ返答してください。\");\n    el.textContent=t?\"✅ 接続できました: \"+t.slice(0,20):\"⚠ 応答が空でした\";\n  }catch(e){el.textContent=\"❌ 接続失敗: \"+(e.name===\"AbortError\"?\"タイムアウト(12秒)\":e.message);}\n};\n\n/* ---------- キャラ設定プロンプト(正典準拠) ---------- */\nconst PERSONA_DOC=`あなたは漫画「ファルダゴ乾杯日和」のキャラクターとして会話します。\n舞台: 冒険者の島ファルダゴ。南欧風の陽気な島。近くに古代文明と魔獣の残る広大な「遺跡島」があり、世界中から冒険者が来る。主役4人は冒険者ではなく、冒険者をサポートする職に就く仲良し4人組。夜は共用スペースに集まり「乾杯!!」するのが日常。\n\n【レオ】20代前半男性。一人称「俺」。魔導具エンジニア(設計・デザイン)。知識欲旺盛で頭がいいが、一人で突っ走ることも。ビビりな面あり。没頭すると寝食を忘れる。自信家で、褒められたら「すげーだろ!」と返す。禁止: ツンデレ演技(「べ、別に…」等は絶対に言わない)。\n【ティエラ】10代後半女性。一人称「私」。祖母に代わり装飾品店を切り盛り。おっとり見えて肝が据わっている。好奇心旺盛。誰に対しても敬語を使わない。「〜だよ」「〜だね」口調。\n【ウェイン】20代前半男性。一人称「俺」。元冒険者で、今は遺跡管理局職員。飄々としているが腕は立つ。楽天的で陽気、パーソナルスペースが狭い。実家は食堂で料理上手だが謎の魔獣肉などえげつない食材を使う(出どころは聞かないのが作法)。趣味は新しい剣を買うこと。口調は「〜だよ」。禁止:「〜だぜ」。\n【ロムド】20代前半男性。一人称「俺」。ギルド連合本部でギルド仲介・クエスト管理。顔が広い。兄貴肌で言葉遣いは粗いが面倒見が良い。\n\nルール:\n- 出力は「キャラID|セリフ」の形式で1〜4行。キャラIDは leo / tiera / wayne / romdo のみ。\n- 例: leo|おう、それ俺の新作だぞ。すげーだろ!\n- 地の文・説明・括弧書きは出力しない。セリフのみ。\n- 明るくテンポのよい掛け合いにする。各キャラの口調・禁止事項を厳守。`;\n\n/* ---------- 定型会話(フォールバック) ---------- */\nconst CANNED=[\n  [[\"wayne\",\"ねえみんな、今夜の煮込み、新しい肉を試したいんだけど\"],[\"leo\",\"待て。その「新しい」って部分を詳しく言え\"],[\"wayne\",\"ふふ、聞かないのが作法だよ\"],[\"romdo\",\"……まあ、どうせうまいんだよな。悔しいことに\"]],\n  [[\"leo\",\"見ろよこの新型ランタン、光量3倍! すげーだろ!\"],[\"tiera\",\"わ、まぶしっ。ね、これお店の看板に使えない?\"],[\"leo\",\"お、いいなそれ。特別仕様で作ってやるよ\"]],\n  [[\"tiera\",\"今日ね、お店に遺跡島帰りの冒険者さんが来て、石を三つも買ってくれたの\"],[\"romdo\",\"ほう、景気いいな。今度うちの受付にも宣伝札を置いとくか?\"],[\"tiera\",\"ほんと? ロムド、ありがと!\"]],\n  [[\"wayne\",\"今日買った剣、見て見て。この反り、芸術だと思わない?\"],[\"leo\",\"お前それ先月も同じこと言ってたぞ\"],[\"wayne\",\"先月のも芸術だったんだよ。つまり俺の部屋は美術館\"],[\"romdo\",\"給料日前に泣きつくなよ、美術館長\"]],\n  [[\"romdo\",\"そういや新しい詰所、骨組みができてたぞ。建築ギルドは仕事が早えな\"],[\"wayne\",\"え、もう? 今度の巡回で見てこよっと\"],[\"tiera\",\"完成したらお祝いだね。乾杯の理由がまた増えちゃう\"]],\n  [[\"leo\",\"……あれ、今日って何曜日だ? 飯食ったっけ?\"],[\"tiera\",\"レオ、また徹夜したんだね。だめだよ、ちゃんと食べなきゃ\"],[\"wayne\",\"はいはい、俺が何か作るよ。台所借りるね\"],[\"romdo\",\"ついでに俺の分も頼むわ\"]],\n  [[\"tiera\",\"ねえ、今度の祭り、みんなで屋台ぜんぶ制覇しない?\"],[\"wayne\",\"いいね! 俺、串焼き担当……いや、全部食べたい\"],[\"leo\",\"射的は俺に任せろ。景品のジャンク品、全部落とす\"],[\"romdo\",\"お前ら、財布の紐ってもんを覚えろ。……ま、俺も行くけどな\"]],\n  [[\"wayne\",\"{name}はもう島に慣れた? 困ってることない?\"],[\"romdo\",\"困ってたら俺のとこに来い。何度でも言うぞ\"],[\"tiera\",\"ふふ、ロムドのそれ、口ぐせだね\"],[\"leo\",\"{name}、道具で困ったら俺な! 俺の工房、島一番だから\"]]\n];\nfunction cannedReply(sel){\n  const pool=CANNED.filter(c=>c.every(l=>sel.includes(l[0])));\n  const pick=pool.length?rnd(pool):rnd(CANNED.map(c=>c.filter(l=>sel.includes(l[0]))).filter(c=>c.length));\n  return (pick||[[\"wayne\",\"今日もいい天気だね。乾杯日和だ!\"]]).map(l=>({ch:l[0],text:l[1].replace(/\\{name\\}/g,S?S.name:\"きみ\")}));\n}\n\n/* ---------- AIトーク画面 ---------- */\nlet AIH=[]; // {who:\"me\"|charId, text}\nfunction aiSelected(){return [...document.querySelectorAll(\".ai-char:checked\")].map(c=>c.value);}\nfunction aiRender(){\n  const log=$(\"ai-log\");log.innerHTML=\"\";\n  AIH.forEach(m=>{\n    const d=document.createElement(\"div\");d.className=\"aimsg\"+(m.who===\"me\"?\" me\":\"\");\n    const ch=CHARS[m.who];\n    const av=m.who===\"me\"?`<div class=\"aport\" style=\"background:var(--sea);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold\">${(S?S.name:\"私\")[0]}<\u002Fdiv>`\n      :(ch&&ch.img?`<img class=\"aport\" src=\"${ASSETS[ch.img]}\">`:`<div class=\"aport\" style=\"background:${ch?ch.color:\"#999\"};border-radius:50%\"><\u002Fdiv>`);\n    d.innerHTML=`${av}<div class=\"abody\"><div class=\"anm\">${m.who===\"me\"?(S?S.name:\"私\"):(ch?ch.name:m.who)}<\u002Fdiv>${m.text}<\u002Fdiv>`;\n    log.appendChild(d);\n  });\n  log.scrollTop=log.scrollHeight;\n}\nfunction parseAIText(t,sel){\n  const out=[];\n  t.split(/\\n+/).forEach(line=>{\n    const m=line.match(/^\\s*(leo|tiera|wayne|romdo)\\s*[|::]\\s*(.+)$/i);\n    if(m&&sel.includes(m[1].toLowerCase()))out.push({ch:m[1].toLowerCase(),text:m[2].trim()});\n  });\n  return out;\n}\nasync function aiSend(){\n  const inp=$(\"ai-input\");const msg=inp.value.trim();inp.value=\"\";\n  const sel=aiSelected();\n  if(!sel.length){$(\"ai-status\").textContent=\"話す相手を選んでね\";return;}\n  if(msg)AIH.push({who:\"me\",text:msg});\n  aiRender();\n  const useAI=CFG.aiOn&&CFG.key;\n  $(\"ai-nokey\").style.display=useAI?\"none\":\"block\";\n  let lines=null;\n  if(useAI){\n    $(\"ai-status\").innerHTML='<span class=\"spin\"><\u002Fspan> みんなが考え中…';\n    const hist=AIH.slice(-16).map(m=>(m.who===\"me\"?`${S.name}(プレイヤー)|${m.text}`:`${m.who}|${m.text}`)).join(\"\\n\");\n    const prompt=`${PERSONA_DOC}\\n\\n今いるメンバー: ${sel.join(\", \")}(このメンバーだけ話す)\\nプレイヤー名: ${S.name}\\n\\nこれまでの会話:\\n${hist||\"(まだ会話なし)\"}\\n\\n${msg?`プレイヤーの発言「${msg}」への返答を`:\"メンバー同士の自然な雑談を\"}、形式どおり1〜4行で出力:`;\n    try{\n      const t=await callAI(prompt);\n      lines=parseAIText(t,sel);\n      if(!lines.length)throw new Error(\"形式外の応答\");\n      $(\"ai-status\").textContent=\"\";\n    }catch(e){\n      $(\"ai-status\").textContent=\"(AI応答に失敗したので定型会話に切り替え: \"+(e.name===\"AbortError\"?\"タイムアウト\":e.message)+\")\";\n      lines=null;\n    }\n  }\n  if(!lines)lines=cannedReply(sel);\n  for(const l of lines){\n    AIH.push({who:l.ch,text:l.text});\n    aiRender();\n    await new Promise(r=>setTimeout(r,350));\n  }\n}\n$(\"btn-ai-send\").onclick=aiSend;\n$(\"ai-input\").addEventListener(\"keydown\",e=>{if(e.key===\"Enter\")aiSend();});\n$(\"btn-ai-clear\").onclick=()=>{AIH=[];aiRender();};\n\n/* ---------- セーブ/ロード ---------- */\nfunction doSave(auto){\n  try{localStorage.setItem(LS.save,JSON.stringify(S));\n    if(!auto)$(\"save-status\").textContent=\"✅ セーブしました(\"+new Date().toLocaleTimeString(\"ja-JP\")+\")\";\n  }catch(e){if(!auto)$(\"save-status\").textContent=\"❌ 保存失敗: \"+e.message;}\n}\nfunction hasSave(){try{return !!localStorage.getItem(LS.save);}catch(e){return false;}}\nfunction loadSaveData(json){\n  const d=JSON.parse(json);\n  if(!d||typeof d!==\"object\"||!d.name||!d.aff)throw new Error(\"セーブデータの形式が違います\");\n  S=Object.assign(newState(),d);\n  closeModal(\"md-save\");\n  fade(()=>gotoMap());\n}\n$(\"btn-save-now\").onclick=()=>doSave(false);\n$(\"btn-save-dl\").onclick=()=>{\n  const blob=new Blob([JSON.stringify(S,null,1)],{type:\"application/json\"});\n  const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n  a.download=\"ファルダゴ冒険譚_セーブ_\"+S.day+\"日目.json\";a.click();\n};\n$(\"btn-load-file\").onclick=()=>$(\"inp-load-file\").click();\n$(\"inp-load-file\").onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();r.onload=()=>{try{loadSaveData(r.result);}catch(err){alert(\"読み込み失敗: \"+err.message);}};\n  r.readAsText(f);e.target.value=\"\";\n};\n$(\"btn-load-paste\").onclick=()=>{try{loadSaveData($(\"ta-save\").value);}catch(err){alert(\"読み込み失敗: \"+err.message);}};\n\n/* ---------- 追加シナリオ ---------- */\nfunction setScnStatus(){\n  $(\"scn-status\").textContent=\"追加シナリオ: \"+(CUSTOM_EVENTS.length?CUSTOM_EVENTS.length+\"件のイベント\":\"なし\");\n}\nfunction loadScenario(json){\n  const d=JSON.parse(json);\n  const evs=Array.isArray(d)?d:(d.events||[]);\n  if(!Array.isArray(evs))throw new Error(\"events配列が見つかりません\");\n  const ok=[];\n  evs.forEach((e,i)=>{\n    if(!e.id||!e.loc||!Array.isArray(e.scenes))throw new Error((i+1)+\"番目のイベントに id / loc / scenes がありません\");\n    ok.push(e);\n  });\n  CUSTOM_EVENTS=ok;\n  try{localStorage.setItem(LS.scenario,JSON.stringify(ok));}catch(e){}\n  setScnStatus();\n}\n$(\"btn-scn-import\").onclick=()=>$(\"inp-scn-file\").click();\n$(\"inp-scn-file\").onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();r.onload=()=>{\n    try{loadScenario(r.result);alert(\"追加シナリオを読み込みました: \"+CUSTOM_EVENTS.length+\"件\");}\n    catch(err){alert(\"読み込み失敗: \"+err.message);}\n  };\n  r.readAsText(f);e.target.value=\"\";\n};\n$(\"btn-scn-clear\").onclick=()=>{\n  if(!CUSTOM_EVENTS.length)return;\n  if(confirm(\"追加シナリオを削除しますか?\")){CUSTOM_EVENTS=[];try{localStorage.removeItem(LS.scenario);}catch(e){}setScnStatus();}\n};\n\n/* ---------- HUDボタン ---------- */\n$(\"btn-status\").onclick=()=>{renderStatus();openModal(\"md-status\");};\n$(\"btn-items\").onclick=()=>{renderItems();openModal(\"md-items\");};\n$(\"btn-ai\").onclick=()=>{$(\"ai-nokey\").style.display=(CFG.aiOn&&CFG.key)?\"none\":\"block\";aiRender();openModal(\"md-ai\");};\n$(\"btn-save\").onclick=()=>{$(\"save-status\").textContent=\"\";openModal(\"md-save\");};\n$(\"btn-settings\").onclick=()=>openModal(\"md-settings\");\n$(\"btn-title-back\").onclick=()=>{\n  if(confirm(\"タイトルに戻りますか?(オートセーブ済み)\")){doSave(true);closeModal(\"md-settings\");location.reload();}\n};\n\n/* ---------- タイトル・起動 ---------- */\n$(\"btn-new\").onclick=()=>{$(\"namebox\").style.display=\"flex\";$(\"inp-name\").focus();};\n$(\"btn-start\").onclick=()=>{\n  const n=$(\"inp-name\").value.trim()||\"アー\";\n  S=newState(n);\n  $(\"namebox\").style.display=\"none\";\n  fade(()=>startScenes(JSON.parse(JSON.stringify(PROLOGUE.scenes)),()=>{doSave(true);gotoMap();}));\n};\n$(\"btn-continue\").onclick=()=>{\n  try{loadSaveData(localStorage.getItem(LS.save));}catch(e){alert(\"セーブデータの読み込みに失敗しました: \"+e.message);}\n};\n$(\"btn-load-title\").onclick=()=>{S=S||newState();openModal(\"md-save\");};\n\nconst _origGotoMap=gotoMap;\ngotoMap=function(){_origGotoMap();doSave(true);};\n\n(function boot(){\n  setBG($(\"title-bg\"),\"port\");\n  loadCfg();\n  try{const sc=localStorage.getItem(LS.scenario);if(sc)CUSTOM_EVENTS=JSON.parse(sc)||[];}catch(e){}\n  setScnStatus();\n  if(hasSave())$(\"btn-continue\").style.display=\"\";\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
